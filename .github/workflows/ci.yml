name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check apps/api/app/ apps/api/tests/

  typecheck:
    name: Type-check (mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e "apps/api[dev]" mypy

      - name: Run mypy
        working-directory: apps/api
        run: python -m mypy app/ --ignore-missing-imports --strict-optional

  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest
    env:
      NEON_API_KEY: test
      CONTROL_DB_URL: postgresql+asyncpg://test:test@localhost:5432/test
      CONTROL_DB_SYNC_URL: postgresql://test:test@localhost:5432/test
      REDIS_URL: redis://localhost:6379/0
      ADMIN_KEY: vrd_admin_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e "apps/api[dev]"

      - name: Generate ephemeral encryption key
        run: |
          echo "NEON_ENCRYPTION_KEY=$(python -c "import os,base64; print(base64.urlsafe_b64encode(os.urandom(32)).decode())")" >> $GITHUB_ENV

      - name: Run unit tests
        working-directory: apps/api
        run: python -m pytest tests/unit -x --tb=short --cov=app --cov-fail-under=80

  test-integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: veridian
          POSTGRES_PASSWORD: veridian
          POSTGRES_DB: veridian_control
        options: >-
          --health-cmd "pg_isready -U veridian -d veridian_control"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      CONTROL_DB_URL: postgresql+asyncpg://veridian:veridian@localhost:5432/veridian_control
      CONTROL_DB_SYNC_URL: postgresql://veridian:veridian@localhost:5432/veridian_control
      REDIS_URL: redis://localhost:6379/0
      NEON_API_KEY: test
      ADMIN_KEY: vrd_admin_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e "apps/api[dev]"

      - name: Generate ephemeral encryption key
        run: |
          echo "NEON_ENCRYPTION_KEY=$(python -c "import os,base64; print(base64.urlsafe_b64encode(os.urandom(32)).decode())")" >> $GITHUB_ENV

      - name: Run control DB migration
        working-directory: apps/api
        run: alembic -c alembic.ini upgrade head

      - name: Run integration tests
        working-directory: apps/api
        run: python -m pytest tests/integration -x --tb=short -m integration -k "not worker_kill"
