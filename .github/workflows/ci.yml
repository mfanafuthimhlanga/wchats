name: CI

on:
  # No `branches:` filter: this repo ships stacked PRs (feature -> feature -> main),
  # and `branches: [main]` meant every PR whose base was not main got zero checks.
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check apps/api/app/ apps/api/tests/

  typecheck:
    name: Type-check (mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e "apps/api[dev]"

      # gates.py runs the same mypy invocation this step used to run bare, and holds
      # the result against MYPY_BASELINE. Bare mypy is red on every commit until #92's
      # 153 errors are gone, so this job gated nothing; the baseline makes it go red on
      # the 154th and green on the 153.
      - name: Run mypy
        working-directory: apps/api
        run: python scripts/gates.py mypy

  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest
    # Redis is required: test_agent_task.py exercises the Celery result backend
    # against a real client. Without it the job dies on ConnectionRefusedError.
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      NEON_API_KEY: test
      CONTROL_DB_URL: postgresql+asyncpg://test:test@localhost:5432/test
      CONTROL_DB_SYNC_URL: postgresql://test:test@localhost:5432/test
      REDIS_URL: redis://localhost:6379/0
      ADMIN_KEY: vrd_admin_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e "apps/api[dev]"

      - name: Generate ephemeral encryption key
        run: |
          echo "NEON_ENCRYPTION_KEY=$(python -c "import os,base64; print(base64.urlsafe_b64encode(os.urandom(32)).decode())")" >> $GITHUB_ENV

      - name: Run unit tests
        working-directory: apps/api
        # No -x: halting at the first failure reports one defect and hides the rest,
        # which is the opposite of what a gate is for. The two ignored modules need
        # docling, which is not in the [dev] extra and cannot be collected here.
        run: >-
          python -m pytest tests/unit --tb=short
          --cov=app --cov-fail-under=80
          --ignore=tests/unit/test_chunking_service.py
          --ignore=tests/unit/test_docling_service.py

  test-integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector's image, not plain postgres:17-alpine. The tenant migration
        # `0001_tenant_v1_schema` runs `CREATE EXTENSION IF NOT EXISTS vector`, and
        # the plain image has no extension control file, so the migration failed and
        # `test_full_chain_completes` reported it as an agent that would not go ready.
        # Same Postgres 17, extension present. Matches the local cluster's pgvector.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: wchats
          POSTGRES_PASSWORD: wchats
          POSTGRES_DB: wchats_control
        options: >-
          --health-cmd "pg_isready -U wchats -d wchats_control"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      CONTROL_DB_URL: postgresql+asyncpg://wchats:wchats@localhost:5432/wchats_control
      CONTROL_DB_SYNC_URL: postgresql://wchats:wchats@localhost:5432/wchats_control
      REDIS_URL: redis://localhost:6379/0
      NEON_API_KEY: test
      ADMIN_KEY: vrd_admin_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e "apps/api[dev]"

      - name: Generate ephemeral encryption key
        run: |
          echo "NEON_ENCRYPTION_KEY=$(python -c "import os,base64; print(base64.urlsafe_b64encode(os.urandom(32)).decode())")" >> $GITHUB_ENV

      - name: Run control DB migration
        working-directory: apps/api
        run: alembic -c alembic.ini upgrade head

      - name: Run integration tests
        working-directory: apps/api
        run: python -m pytest tests/integration -x --tb=short -m integration -k "not worker_kill"

  eval-deterministic:
    name: Eval (deterministic checks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -e "apps/api[dev]"

      - name: Set up pnpm
        # apps/widget is a pnpm workspace and `pnpm-lock.yaml` is the lockfile the
        # repo maintains. This step must precede setup-node.
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # 22, not 20. pnpm 11 refuses to start on Node 20 ("requires at least
          # Node.js v22.13"), and it dies reaching for node:sqlite, which Node 20
          # does not carry. vite 8 asks for ^20.19.0 || >=22.12.0, so 22 satisfies
          # both, and the runner has been deprecating Node 20 for actions anyway.
          node-version: "22"

      - name: Install Chromium headless shell for the widget
        # The widget's postbuild runs scripts/check-rendered-notice.mjs, which
        # measures the disclosure notice in a real browser (#106). ubuntu-latest
        # ships no Playwright browser, so install the one playwright-core 1.61.1
        # resolves before the build reaches that step. This installs first
        # because pnpm exec cannot call playwright-core until it is on disk.
        # The build step's own install then finds everything already there.
        working-directory: apps/widget
        run: pnpm install --frozen-lockfile && pnpm exec playwright-core install --with-deps chromium-headless-shell

      - name: Build widget bundle
        working-directory: apps/widget
        run: pnpm install --frozen-lockfile && pnpm run build

      # #135 review: postbuild's sync-embed runs in WRITE mode and would
      # silently overwrite committed drift in this checkout, so the gate is
      # the git diff, not the script's own --check.
      - name: Widget embed targets match the committed build (drift gate)
        run: git diff --exit-code -- apps/widget/embed apps/admin/public/wchats apps/api/static/wchats

      - name: Run deterministic evals (D3, D5, D6, D7, G-06)
        working-directory: apps/api
        # -rs so a skip states its reason, and the junit assertion so a run that
        # asserted nothing cannot report a pass. Run 33150722736 reported success
        # over "1 skipped, 1 deselected in 0.08s" under a job name claiming five
        # checks (#102). A gate over zero observations is unknown, never pass.
        run: |
          python -m pytest tests/evals/run_evals.py -k deterministic -v -rs --tb=short --junitxml=eval-deterministic.xml
          python scripts/assert_tests_ran.py eval-deterministic.xml
