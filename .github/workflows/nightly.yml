name: Nightly E2E

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  e2e-neon:
    name: E2E — real Neon provisioning
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector's image, not plain postgres:17-alpine. The tenant migration
        # `0001_tenant_v1_schema` runs `CREATE EXTENSION IF NOT EXISTS vector`, and
        # the plain image has no extension control file, so the migration failed and
        # `test_full_chain_completes` reported it as an agent that would not go ready.
        # Same Postgres 17, extension present. Matches the local cluster's pgvector.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: wchats
          POSTGRES_PASSWORD: wchats
          POSTGRES_DB: wchats_control
        options: >-
          --health-cmd "pg_isready -U wchats -d wchats_control"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY_TEST }}
      NEON_ENCRYPTION_KEY: ${{ secrets.NEON_ENCRYPTION_KEY }}
      CONTROL_DB_URL: postgresql+asyncpg://wchats:wchats@localhost:5432/wchats_control
      CONTROL_DB_SYNC_URL: postgresql://wchats:wchats@localhost:5432/wchats_control
      REDIS_URL: redis://localhost:6379/0
      ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
      NEON_REGION: aws-us-east-1
      # Run-scoped ledger of Neon project ids this job created. The E2E test
      # appends an id the moment the control DB records it and removes it again
      # once deletion is verified, so whatever survives here is exactly what
      # leaked. See tests/e2e/_neon_teardown.py.
      WCHATS_NEON_PROJECT_LEDGER: ${{ github.workspace }}/neon-e2e-projects.txt
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e "apps/api[dev]"

      - name: Run control DB migration
        working-directory: apps/api
        run: alembic -c alembic.ini upgrade head

      - name: Run E2E tests against real Neon
        working-directory: apps/api
        run: python -m pytest tests/e2e/test_neon_e2e.py -x --tb=short -m e2e

      # Reclaims ONLY the project ids this job's own test recorded in the
      # ledger. It never lists the account and never matches a project by name.
      #
      # The step this replaces did exactly that: it listed every project the key
      # could see and deleted each one whose name matched
      # `startswith('vrd-') and 'e2e' in name`. Deleting somebody else's data
      # because its name looks like a test is irreversible, and the pattern was
      # dead anyway — `_project_slug` names the E2E agent's project
      # `e2e-agent-…`, never `vrd-…`, so the sweep reclaimed nothing while
      # remaining able to destroy anything.
      #
      # No `|| echo`: a leak must fail the job, not scroll past it.
      - name: Teardown — delete Neon projects THIS run created (by id)
        if: always()
        working-directory: apps/api
        run: python -m tests.e2e._neon_teardown

  eval-full:
    name: Eval Full — LLM-judged D1/D2/D3/D4/D8
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector's image, not plain postgres:17-alpine. The tenant migration
        # `0001_tenant_v1_schema` runs `CREATE EXTENSION IF NOT EXISTS vector`, and
        # the plain image has no extension control file, so the migration failed and
        # `test_full_chain_completes` reported it as an agent that would not go ready.
        # Same Postgres 17, extension present. Matches the local cluster's pgvector.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: wchats
          POSTGRES_PASSWORD: wchats
          POSTGRES_DB: wchats_control
        options: >-
          --health-cmd "pg_isready -U wchats -d wchats_control"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      CONTROL_DB_URL: postgresql+asyncpg://wchats:wchats@localhost:5432/wchats_control
      CONTROL_DB_SYNC_URL: postgresql://wchats:wchats@localhost:5432/wchats_control
      REDIS_URL: redis://localhost:6379/0
      ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY_TEST }}
      NEON_ENCRYPTION_KEY: ${{ secrets.NEON_ENCRYPTION_KEY }}
      NEON_REGION: aws-us-east-1
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      AGENT_E2E_ENABLED: "1"
      AGENT_ID: ${{ secrets.EVAL_DEMO_AGENT_ID }}
      API_KEY: ${{ secrets.EVAL_DEMO_API_KEY }}
      AGENT_BASE_URL: http://localhost:8000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up pnpm
        # apps/widget is a pnpm workspace and `pnpm-lock.yaml` is the lockfile the
        # repo maintains. This step must precede setup-node.
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          # 22, not 20. pnpm 11 refuses to start on Node 20 ("requires at least
          # Node.js v22.13"), and it dies reaching for node:sqlite, which Node 20
          # does not carry. vite 8 asks for ^20.19.0 || >=22.12.0, so 22 satisfies
          # both, and the runner has been deprecating Node 20 for actions anyway.
          node-version: "22"

      - name: Install Python dependencies
        run: pip install -e "apps/api[dev]"

      - name: Install Chromium headless shell for the widget
        # The widget's postbuild runs scripts/check-rendered-notice.mjs, which
        # measures the disclosure notice in a real browser (#106). ubuntu-latest
        # ships no Playwright browser, so install the one playwright-core 1.61.1
        # resolves before the build reaches that step. This installs first
        # because pnpm exec cannot call playwright-core until it is on disk.
        # The build step's own install then finds everything already there.
        working-directory: apps/widget
        run: pnpm install --frozen-lockfile && pnpm exec playwright-core install --with-deps chromium-headless-shell

      - name: Build widget (required for D7)
        working-directory: apps/widget
        run: pnpm install --frozen-lockfile && pnpm run build

      - name: Run control DB migration
        working-directory: apps/api
        run: alembic -c alembic.ini upgrade head

      - name: Start API server
        working-directory: apps/api
        run: uvicorn app.main:app --host 0.0.0.0 --port 8000 &

      - name: Start Celery worker
        working-directory: apps/api
        run: celery -A app.worker.celery_app worker -Q pipeline,runtime --pool=solo --loglevel=warning &

      - name: Wait for API to be ready
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/health; then
              echo "API ready after ${i} attempts"
              break
            fi
            echo "Waiting for API... ($i/20)"
            sleep 3
          done

      - name: Capture eval responses
        working-directory: apps/api
        run: python tests/evals/capture_responses.py --overwrite

      - name: Run full eval suite (LLM-judged D1/D2/D3/D4/D8 + deterministic)
        working-directory: apps/api
        run: pytest tests/evals/run_evals.py -v --tb=short
