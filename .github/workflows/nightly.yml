name: Nightly E2E

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  e2e-neon:
    name: E2E — real Neon provisioning
    runs-on: ubuntu-latest
    # The three spend-bearing secrets live on the `wchats / staging` environment,
    # never at repository level, and GitHub hands an environment's secrets only to
    # a job that names it. Without this key both jobs read empty strings and the
    # E2E run dies at Neon with "not authenticated" (#147).
    environment: "wchats / staging"
    services:
      postgres:
        # pgvector's image, not plain postgres:17-alpine. The tenant migration
        # `0001_tenant_v1_schema` runs `CREATE EXTENSION IF NOT EXISTS vector`, and
        # the plain image has no extension control file, so the migration failed and
        # `test_full_chain_completes` reported it as an agent that would not go ready.
        # Same Postgres 17, extension present. Matches the local cluster's pgvector.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: wchats
          POSTGRES_PASSWORD: wchats
          POSTGRES_DB: wchats_control
        options: >-
          --health-cmd "pg_isready -U wchats -d wchats_control"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      # Two secrets carry real spend. The Neon key provisions real projects and
      # the Voyage key embeds. The API process needs every other name too, and
      # this job generates or literals those, as ci.yml does, so a missing
      # repository secret cannot take the job down (#147).
      NEON_API_KEY: ${{ secrets.NEON_API_KEY_TEST }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      CONTROL_DB_URL: postgresql+asyncpg://wchats:wchats@localhost:5432/wchats_control
      CONTROL_DB_SYNC_URL: postgresql://wchats:wchats@localhost:5432/wchats_control
      REDIS_URL: redis://localhost:6379/0
      ADMIN_KEY: vrd_admin_nightly
      JWT_SECRET: nightly-jwt-secret-not-a-real-one
      CLERK_WEBHOOK_SIGNING_SECRET: whsec_nightly_not_a_real_one
      NEON_REGION: aws-us-east-1
      # Run-scoped ledger of Neon project ids this job created. The E2E test
      # appends an id the moment the control DB records it and removes it again
      # once deletion is verified, so whatever survives here is exactly what
      # leaked. See tests/e2e/_neon_teardown.py.
      WCHATS_NEON_PROJECT_LEDGER: ${{ github.workspace }}/neon-e2e-projects.txt
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e "apps/api[dev]"

      - name: Generate the per-run key material
        # Two no-default settings that encrypt nothing this job keeps. A fresh
        # value per run, the way ci.yml does it, instead of a repository secret.
        run: |
          echo "NEON_ENCRYPTION_KEY=$(python -c "import os,base64; print(base64.urlsafe_b64encode(os.urandom(32)).decode())")" >> $GITHUB_ENV
          echo "PLATFORM_CREDENTIAL_KEY=$(python -c "import os,base64; print(base64.urlsafe_b64encode(os.urandom(32)).decode())")" >> $GITHUB_ENV

      - name: Run control DB migration
        working-directory: apps/api
        run: alembic -c alembic.ini upgrade head

      - name: Run E2E tests against real Neon
        working-directory: apps/api
        run: python -m pytest tests/e2e/test_neon_e2e.py -x --tb=short -m e2e

      # Reclaims ONLY the project ids this job's own test recorded in the
      # ledger. It never lists the account and never matches a project by name.
      #
      # The step this replaces did exactly that: it listed every project the key
      # could see and deleted each one whose name matched
      # `startswith('vrd-') and 'e2e' in name`. Deleting somebody else's data
      # because its name looks like a test is irreversible, and the pattern was
      # dead anyway — `_project_slug` names the E2E agent's project
      # `e2e-agent-…`, never `vrd-…`, so the sweep reclaimed nothing while
      # remaining able to destroy anything.
      #
      # No `|| echo`: a leak must fail the job, not scroll past it.
      - name: Teardown — delete Neon projects THIS run created (by id)
        if: always()
        working-directory: apps/api
        run: python -m tests.e2e._neon_teardown

  eval-full:
    name: Eval Full — LLM-judged D1/D2/D3/D4/D8
    runs-on: ubuntu-latest
    # The three spend-bearing secrets live on the `wchats / staging` environment,
    # never at repository level, and GitHub hands an environment's secrets only to
    # a job that names it. Without this key both jobs read empty strings and the
    # E2E run dies at Neon with "not authenticated" (#147).
    environment: "wchats / staging"
    services:
      postgres:
        # pgvector's image, not plain postgres:17-alpine. The tenant migration
        # `0001_tenant_v1_schema` runs `CREATE EXTENSION IF NOT EXISTS vector`, and
        # the plain image has no extension control file, so the migration failed and
        # `test_full_chain_completes` reported it as an agent that would not go ready.
        # Same Postgres 17, extension present. Matches the local cluster's pgvector.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: wchats
          POSTGRES_PASSWORD: wchats
          POSTGRES_DB: wchats_control
        options: >-
          --health-cmd "pg_isready -U wchats -d wchats_control"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      CONTROL_DB_URL: postgresql+asyncpg://wchats:wchats@localhost:5432/wchats_control
      CONTROL_DB_SYNC_URL: postgresql://wchats:wchats@localhost:5432/wchats_control
      REDIS_URL: redis://localhost:6379/0
      ADMIN_KEY: vrd_admin_nightly
      JWT_SECRET: nightly-jwt-secret-not-a-real-one
      CLERK_WEBHOOK_SIGNING_SECRET: whsec_nightly_not_a_real_one
      NEON_API_KEY: ${{ secrets.NEON_API_KEY_TEST }}
      NEON_REGION: aws-us-east-1
      # The provider is OpenAI (ADR 0008). The Anthropic key this job read until
      # 2026-09-02 was revoked on 2026-08-27 and never existed as a secret.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      AGENT_E2E_ENABLED: "1"
      AGENT_ID: ${{ secrets.EVAL_DEMO_AGENT_ID }}
      API_KEY: ${{ secrets.EVAL_DEMO_API_KEY }}
      # Staging, not this job's own container. `capture_responses.py` drives a
      # provisioned, ingested agent, and the Postgres beside this job was migrated
      # one minute ago and holds no tenant and no agent, so EVAL_DEMO_AGENT_ID can
      # never name a row in it. #147 recorded that gap and its comment chose
      # staging over provisioning an agent inline. Set STAGING_AGENT_BASE_URL on
      # the `wchats / staging` environment once #57 lands.
      AGENT_BASE_URL: ${{ vars.STAGING_AGENT_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up pnpm
        # apps/widget is a pnpm workspace and `pnpm-lock.yaml` is the lockfile the
        # repo maintains. This step must precede setup-node.
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          # 22, not 20. pnpm 11 refuses to start on Node 20 ("requires at least
          # Node.js v22.13"), and it dies reaching for node:sqlite, which Node 20
          # does not carry. vite 8 asks for ^20.19.0 || >=22.12.0, so 22 satisfies
          # both, and the runner has been deprecating Node 20 for actions anyway.
          node-version: "22"

      - name: Install Python dependencies
        run: pip install -e "apps/api[dev]"

      - name: Generate the per-run key material
        # Two no-default settings that encrypt nothing this job keeps. A fresh
        # value per run, the way ci.yml does it, instead of a repository secret.
        run: |
          echo "NEON_ENCRYPTION_KEY=$(python -c "import os,base64; print(base64.urlsafe_b64encode(os.urandom(32)).decode())")" >> $GITHUB_ENV
          echo "PLATFORM_CREDENTIAL_KEY=$(python -c "import os,base64; print(base64.urlsafe_b64encode(os.urandom(32)).decode())")" >> $GITHUB_ENV

      - name: Install Chromium headless shell for the widget
        # The widget's postbuild runs scripts/check-rendered-notice.mjs, which
        # measures the disclosure notice in a real browser (#106). ubuntu-latest
        # ships no Playwright browser, so install the one playwright-core 1.61.1
        # resolves before the build reaches that step. This installs first
        # because pnpm exec cannot call playwright-core until it is on disk.
        # The build step's own install then finds everything already there.
        working-directory: apps/widget
        run: pnpm install --frozen-lockfile && pnpm exec playwright-core install --with-deps chromium-headless-shell

      - name: Build widget (required for D7)
        working-directory: apps/widget
        run: pnpm install --frozen-lockfile && pnpm run build

      - name: Run control DB migration
        working-directory: apps/api
        run: alembic -c alembic.ini upgrade head

      # LAST OF THE UNGATED STEPS, immediately before the three that need a
      # target. Moving it to position two is the obvious optimisation and it is
      # wrong: every step above it is a check that needs no staging target, and
      # while staging does not exist they are the only signal a scheduled nightly
      # still produces. Python, pnpm, Node 22, the Chromium headless shell, two
      # `pnpm install --frozen-lockfile` runs, the widget build with its
      # `scripts/check-rendered-notice.mjs` postbuild, and `alembic upgrade head`
      # against pgvector all run on every nightly today. A resolve step at
      # position two exits 1 ahead of all of them, so a widget size regression or
      # a broken migration would stop being visible anywhere until #57 lands.
      # Failing early saves runner minutes on a job that already fails; it costs
      # the only checks that job still performs.
      - name: Resolve the eval target
        # The three names this job needs to drive an agent. This job's own Postgres
        # is migrated at job start and holds no tenant and no agent, so there is no
        # local fallback: absent any of the three the run measures nothing (#147).
        #
        # IT FAILS, rather than publishing `ready=0` and letting every downstream
        # step skip itself. A draft of this step earlier in this same branch did
        # that, and review caught it before it merged, so no run ever behaved that
        # way: `main` has no resolve step at all and the last eight scheduled runs
        # each concluded `failure`, the most recent at "Wait for API to be ready".
        # A skipped step reports as a success, so the draft would have made the job
        # conclusion `success` over zero evals, which is the false reading
        # `scripts/assert_tests_ran.py` forbids one step down and is no better one
        # job up: a gate over zero observations is unknown, never pass. A red
        # scheduled nightly is the honest state until STAGING_AGENT_BASE_URL,
        # EVAL_DEMO_AGENT_ID and EVAL_DEMO_API_KEY exist on the
        # `wchats / staging` environment.
        #
        # BLANK COUNTS AS MISSING, AND THE TRIMMED VALUE IS WHAT TRAVELS ON.
        # `[ -z "$VAR" ]` is false for "   ", so a variable holding only spaces
        # reads as present here. A secret pasted with a trailing newline is the
        # ordinary way that happens. Validating a stripped value and then handing
        # the raw one onward keeps the whole defect: the wait step curls
        # "${AGENT_BASE_URL}/health", curl exits 3 on the malformed URL, and the
        # job dies sixty seconds later on the symptom this step exists to name. So
        # the value the emptiness test already computed is the value written to
        # $GITHUB_ENV, and every later step reads that one. All three are written,
        # because a newline on the API key breaks the capture the same way. A
        # $GITHUB_ENV write beats the job-level `env:` for every later step, and
        # `tr -d '[:space:]'` leaves no newline in any value, so none of them can
        # smuggle a second line into the environment file.
        run: |
          trim() { printf '%s' "$1" | tr -d '[:space:]'; }
          missing=""
          require() {
            if [ -z "$(trim "$2")" ]; then
              missing="$missing $1"
            fi
          }
          require "STAGING_AGENT_BASE_URL(variable)" "$AGENT_BASE_URL"
          require "EVAL_DEMO_AGENT_ID(secret)" "$AGENT_ID"
          require "EVAL_DEMO_API_KEY(secret)" "$API_KEY"
          if [ -n "$missing" ]; then
            echo "The 'wchats / staging' environment is missing:$missing"
            echo "This job drives a provisioned, ingested agent on staging (#147). It has no agent of its own to fall back to, so it fails here rather than reporting a green check over zero evals."
            exit 1
          fi
          {
            echo "AGENT_BASE_URL=$(trim "$AGENT_BASE_URL")"
            echo "AGENT_ID=$(trim "$AGENT_ID")"
            echo "API_KEY=$(trim "$API_KEY")"
          } >> "$GITHUB_ENV"
          echo "Driving $(trim "$AGENT_BASE_URL")"

      - name: Wait for the eval target to be ready
        # A loop that runs out and moves on lets the next step fail on a symptom
        # ("Capture eval responses" against nothing) while the cause, an
        # unreachable target, scrolled past. The step that can name the cause fails.
        run: |
          ready=0
          for i in $(seq 1 20); do
            if curl -sf "${AGENT_BASE_URL}/health"; then
              echo "Target ready after ${i} attempts"
              ready=1
              break
            fi
            echo "Waiting for the eval target... ($i/20)"
            sleep 3
          done
          if [ "$ready" != "1" ]; then
            echo "${AGENT_BASE_URL}/health did not answer in 60s, so there is no agent to capture against."
            exit 1
          fi

      - name: Capture eval responses
        working-directory: apps/api
        run: python tests/evals/capture_responses.py --overwrite

      - name: Run full eval suite (LLM-judged D1/D2/D3/D4/D8 + deterministic)
        working-directory: apps/api
        # -rs so a skip states its reason, and the junit assertion so a run that
        # asserted nothing cannot report a pass. Run 33150722736 reported success
        # over "1 skipped, 1 deselected in 0.08s" under a job name claiming five
        # checks (#102). A gate over zero observations is unknown, never pass.
        run: |
          python -m pytest tests/evals/run_evals.py -v -rs --tb=short --junitxml=eval-full.xml
          python scripts/assert_tests_ran.py eval-full.xml
