<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Display scale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..800,0..100&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
<style>
html, body { width: 700px; height: 280px; }

</style>
</head>
<body>

<div style="height: 100%; display: flex; flex-direction: column; gap: 16px; justify-content: center;">
  
    <div style="display: flex; align-items: baseline; gap: 18px;">
      <span class="mono" style="font-size: 10px; color: var(--text-4); width: 70px; flex-shrink: 0; letter-spacing: 0.02em;">86 / hero</span>
      <span style="font-family: var(--font-display); font-size: 86px; line-height: 0.98; letter-spacing: -0.035em; font-weight: 400; font-variation-settings: 'opsz' 144, 'SOFT' 50; color: var(--text-1);">The chat widget</span>
    </div>
  
    <div style="display: flex; align-items: baseline; gap: 18px;">
      <span class="mono" style="font-size: 10px; color: var(--text-4); width: 70px; flex-shrink: 0; letter-spacing: 0.02em;">42 / h1</span>
      <span style="font-family: var(--font-display); font-size: 42px; line-height: 1.1; letter-spacing: -0.025em; font-weight: 400; font-variation-settings: 'opsz' 144, 'SOFT' 50; color: var(--text-1);">Four steps. <em style="font-style:italic;font-weight:300;color:var(--accent);font-variation-settings:'opsz' 144,'SOFT' 100;">One pipeline.</em></span>
    </div>
  
    <div style="display: flex; align-items: baseline; gap: 18px;">
      <span class="mono" style="font-size: 10px; color: var(--text-4); width: 70px; flex-shrink: 0; letter-spacing: 0.02em;">32 / h2</span>
      <span style="font-family: var(--font-display); font-size: 32px; line-height: 1.1; letter-spacing: -0.022em; font-weight: 400; font-variation-settings: 'opsz' 144, 'SOFT' 50; color: var(--text-1);">Configure your agent</span>
    </div>
  
    <div style="display: flex; align-items: baseline; gap: 18px;">
      <span class="mono" style="font-size: 10px; color: var(--text-4); width: 70px; flex-shrink: 0; letter-spacing: 0.02em;">22 / h3</span>
      <span style="font-family: var(--font-display); font-size: 22px; line-height: 1.15; letter-spacing: -0.015em; font-weight: 400; font-variation-settings: 'opsz' 144, 'SOFT' 50; color: var(--text-1);">Kgalema — customer support</span>
    </div>
  
</div>

</body>
</html>
