<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Surfaces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..800,0..100&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
<style>
html, body { width: 700px; height: 200px; }

</style>

<body>

<div class="row" style="gap: 14px; height: 100%; align-items: stretch;">
  
    <div style="flex:1; display:flex; flex-direction:column; gap:10px;">
      <div style="flex:1; border-radius: 14px; background: #0B0717; border: 1px solid var(--border-soft); min-height: 90px;"></div>
      <div style="display:flex; flex-direction:column; gap: 2px;">
        <span style="font-size: 11px; font-weight: 600; color: var(--text-1);">--bg-deep</span>
        <span class="mono" style="font-size: 10px; color: var(--text-3);">#0B0717</span>
        <span style="font-size: 10px; color: var(--text-4);">deepest</span>
      </div>
    </div>
  
    <div style="flex:1; display:flex; flex-direction:column; gap:10px;">
      <div style="flex:1; border-radius: 14px; background: #110C24; border: 1px solid var(--border-soft); min-height: 90px;"></div>
      <div style="display:flex; flex-direction:column; gap: 2px;">
        <span style="font-size: 11px; font-weight: 600; color: var(--text-1);">--bg</span>
        <span class="mono" style="font-size: 10px; color: var(--text-3);">#110C24</span>
        <span style="font-size: 10px; color: var(--text-4);">page</span>
      </div>
    </div>
  
    <div style="flex:1; display:flex; flex-direction:column; gap:10px;">
      <div style="flex:1; border-radius: 14px; background: #181232; border: 1px solid var(--border-soft); min-height: 90px;"></div>
      <div style="display:flex; flex-direction:column; gap: 2px;">
        <span style="font-size: 11px; font-weight: 600; color: var(--text-1);">--bg-elev</span>
        <span class="mono" style="font-size: 10px; color: var(--text-3);">#181232</span>
        <span style="font-size: 10px; color: var(--text-4);">elevated</span>
      </div>
    </div>
  
    <div style="flex:1; display:flex; flex-direction:column; gap:10px;">
      <div style="flex:1; border-radius: 14px; background: #1E1638; border: 1px solid var(--border-soft); min-height: 90px;"></div>
      <div style="display:flex; flex-direction:column; gap: 2px;">
        <span style="font-size: 11px; font-weight: 600; color: var(--text-1);">--surface-1</span>
        <span class="mono" style="font-size: 10px; color: var(--text-3);">#1E1638</span>
        <span style="font-size: 10px; color: var(--text-4);">card</span>
      </div>
    </div>
  
    <div style="flex:1; display:flex; flex-direction:column; gap:10px;">
      <div style="flex:1; border-radius: 14px; background: #2A1E4A; border: 1px solid var(--border-soft); min-height: 90px;"></div>
      <div style="display:flex; flex-direction:column; gap: 2px;">
        <span style="font-size: 11px; font-weight: 600; color: var(--text-1);">--surface-2</span>
        <span class="mono" style="font-size: 10px; color: var(--text-3);">#2A1E4A</span>
        <span style="font-size: 10px; color: var(--text-4);">elevated card</span>
      </div>
    </div>
  
    <div style="flex:1; display:flex; flex-direction:column; gap:10px;">
      <div style="flex:1; border-radius: 14px; background: #382860; border: 1px solid var(--border-soft); min-height: 90px;"></div>

        <span style="font-size: 11px; font-weight: 600; color: var(--text-1);">--surface-3</span>
        <span class="mono" style="font-size: 10px; color: var(--text-3);">#382860</span>
        <span style="font-size: 10px; color: var(--text-4);">highest</span>
