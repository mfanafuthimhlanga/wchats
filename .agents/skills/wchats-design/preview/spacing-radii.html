<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Radii</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..800,0..100&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
<style>
html, body { width: 700px; height: 220px; }

</style>
</head>
<body>

<div style="height: 100%; display: flex; flex-direction: column; gap: 20px; justify-content: center;">
  <div class="label">Corner radii</div>
  <div style="display: flex; gap: 20px; align-items: flex-end;">
    
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
        <div style="width: 88px; height: 88px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;"></div>
        <div style="text-align: center; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 11px; font-weight: 600; color: var(--text-1);">--radius-xs</span>
          <span class="mono" style="font-size: 10px; color: var(--text-3);">8px</span>
          <span style="font-size: 9.5px; color: var(--text-4); max-width: 100px; line-height: 1.3;">buttons · inputs · chips · logo</span>
        </div>
      </div>
    
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
        <div style="width: 88px; height: 88px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px;"></div>
        <div style="text-align: center; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 11px; font-weight: 600; color: var(--text-1);">--radius-sm</span>
          <span class="mono" style="font-size: 10px; color: var(--text-3);">14px</span>
          <span style="font-size: 9.5px; color: var(--text-4); max-width: 100px; line-height: 1.3;">panels · demo step rows</span>
        </div>
      </div>
    
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
        <div style="width: 88px; height: 88px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 20px;"></div>
        <div style="text-align: center; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 11px; font-weight: 600; color: var(--text-1);">--radius-md</span>
          <span class="mono" style="font-size: 10px; color: var(--text-3);">20px</span>
          <span style="font-size: 9.5px; color: var(--text-4); max-width: 100px; line-height: 1.3;">cards · hero card · modals</span>
        </div>
      </div>
    
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
        <div style="width: 88px; height: 88px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 28px;"></div>
        <div style="text-align: center; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 11px; font-weight: 600; color: var(--text-1);">--radius-lg</span>
          <span class="mono" style="font-size: 10px; color: var(--text-3);">28px</span>
          <span style="font-size: 9.5px; color: var(--text-4); max-width: 100px; line-height: 1.3;">feature blocks (rare)</span>
        </div>
      </div>
    
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
        <div style="width: 88px; height: 88px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 100px;"></div>
        <div style="text-align: center; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 11px; font-weight: 600; color: var(--text-1);">--radius-pill</span>
          <span class="mono" style="font-size: 10px; color: var(--text-3);">100px</span>
          <span style="font-size: 9.5px; color: var(--text-4); max-width: 100px; line-height: 1.3;">status chips · eyebrows</span>
        </div>
      </div>
    
  </div>
</div>

</body>
</html>
