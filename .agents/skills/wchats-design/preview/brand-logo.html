<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Logo · marks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..800,0..100&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
<style>
html, body { width: 700px; height: 200px; }

</style>
</head>
<body>

<div style="display: grid; grid-template-columns: 1fr 1.5fr; gap: 20px; height: 100%; align-items: center;">
  <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 24px; background: var(--bg); border: 1px solid var(--border-soft); border-radius: 16px; height: 100%; justify-content: center;">
    <div style="width: 64px; height: 64px; background: linear-gradient(135deg, #F4748C 0%, #C8485E 100%); border-radius: 16px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 1px rgba(244,116,140,0.25), 0 8px 24px rgba(244,116,140,0.32); position: relative;">
      <div style="position: absolute; inset: 2px; border-radius: 14px; background: linear-gradient(180deg, rgba(255,255,255,0.15), transparent 40%);"></div>
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="position: relative;"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    </div>
    <span class="mono" style="font-size: 9.5px; color: var(--text-4); letter-spacing: 0.04em;">mark · 30/64px · 8px-rounded</span>
  </div>
  <div style="display: flex; flex-direction: column; gap: 18px; padding: 24px;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="width: 30px; height: 30px; background: linear-gradient(135deg, #F4748C 0%, #C8485E 100%); border-radius: 8px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 1px rgba(244,116,140,0.25), 0 4px 16px rgba(244,116,140,0.25);">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </div>
      <span style="font-family: var(--font-display); font-size: 22px; font-weight: 500; font-variation-settings: 'opsz' 144, 'SOFT' 50; color: var(--text-1); letter-spacing: -0.015em;">w<span style="color: var(--accent);">.</span>chats</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px; font-size: 11px; color: var(--text-3); font-family: var(--font-mono); letter-spacing: 0.02em;">
      <span>Fraunces · 500 · opsz 144 · SOFT 50</span>
      <span>letter-spacing: -0.015em</span>
      <span>The "." is always --accent</span>
    </div>
  </div>
</div>

</body>
</html>
