<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Micro labels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..800,0..100&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
<style>
html, body { width: 700px; height: 200px; }

</style>
</head>
<body>

<div style="height: 100%; display: flex; flex-direction: column; gap: 18px; justify-content: center;">
  <div class="label">Micro labels · UPPERCASE TRACKED · 0.12em</div>
  <div style="display: flex; flex-direction: column; gap: 16px;">
    <div style="display: flex; align-items: center; gap: 14px;">
      <span style="width: 24px; height: 1px; background: var(--accent);"></span>
      <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent);">How it works</span>
      <span class="mono" style="font-size: 10px; color: var(--text-4); margin-left: 16px;">— eyebrow over h2 (16em)</span>
    </div>
    <div style="display: flex; align-items: center; gap: 14px;">
      <span style="font-size: 10.5px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-3);">7d Conversations</span>
      <span class="mono" style="font-size: 10px; color: var(--text-4); margin-left: 16px;">— stat label (12em)</span>
    </div>
    <div style="display: flex; align-items: center; gap: 14px;">
      <span style="font-size: 9.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-4);">Faith.</span>
      <span class="mono" style="font-size: 10px; color: var(--text-4); margin-left: 16px;">— inner metric label (10em)</span>
    </div>
    <div style="display: flex; align-items: center; gap: 14px;">
      <span style="font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent);">Open Source · AGPL-3.0</span>
      <span class="mono" style="font-size: 10px; color: var(--text-4); margin-left: 16px;">— footer tag (8em)</span>
    </div>
  </div>
</div>

</body>
</html>
