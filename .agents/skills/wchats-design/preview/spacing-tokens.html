<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spacing scale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..800,0..100&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
<style>
html, body { width: 700px; height: 240px; }

</style>
</head>
<body>

<div style="height: 100%; display: flex; flex-direction: column; gap: 14px; justify-content: center;">
  <div class="label">Spacing · 4px base grid</div>
  <div style="display: flex; flex-direction: column; gap: 8px;">
    
      <div style="display: flex; align-items: center; gap: 14px;">
        <span class="mono" style="width: 56px; font-size: 10px; color: var(--text-3); letter-spacing: 0.02em;">--s-1</span>
        <span class="mono" style="width: 40px; font-size: 10px; color: var(--text-4);">4px</span>
        <div style="height: 14px; width: 16px; background: linear-gradient(90deg, var(--accent), var(--lilac)); border-radius: 4px; opacity: 0.7;"></div>
      </div>
    
      <div style="display: flex; align-items: center; gap: 14px;">
        <span class="mono" style="width: 56px; font-size: 10px; color: var(--text-3); letter-spacing: 0.02em;">--s-2</span>
        <span class="mono" style="width: 40px; font-size: 10px; color: var(--text-4);">8px</span>
        <div style="height: 14px; width: 32px; background: linear-gradient(90deg, var(--accent), var(--lilac)); border-radius: 4px; opacity: 0.7;"></div>
      </div>
    
      <div style="display: flex; align-items: center; gap: 14px;">
        <span class="mono" style="width: 56px; font-size: 10px; color: var(--text-3); letter-spacing: 0.02em;">--s-3</span>
        <span class="mono" style="width: 40px; font-size: 10px; color: var(--text-4);">12px</span>
        <div style="height: 14px; width: 48px; background: linear-gradient(90deg, var(--accent), var(--lilac)); border-radius: 4px; opacity: 0.7;"></div>
      </div>
    
      <div style="display: flex; align-items: center; gap: 14px;">
        <span class="mono" style="width: 56px; font-size: 10px; color: var(--text-3); letter-spacing: 0.02em;">--s-4</span>
        <span class="mono" style="width: 40px; font-size: 10px; color: var(--text-4);">16px</span>
        <div style="height: 14px; width: 64px; background: linear-gradient(90deg, var(--accent), var(--lilac)); border-radius: 4px; opacity: 0.7;"></div>
      </div>
    
      <div style="display: flex; align-items: center; gap: 14px;">
        <span class="mono" style="width: 56px; font-size: 10px; color: var(--text-3); letter-spacing: 0.02em;">--s-5</span>
        <span class="mono" style="width: 40px; font-size: 10px; color: var(--text-4);">20px</span>
        <div style="height: 14px; width: 80px; background: linear-gradient(90deg, var(--accent), var(--lilac)); border-radius: 4px; opacity: 0.7;"></div>
      </div>
    
      <div style="display: flex; align-items: center; gap: 14px;">
        <span class="mono" style="width: 56px; font-size: 10px; color: var(--text-3); letter-spacing: 0.02em;">--s-6</span>
        <span class="mono" style="width: 40px; font-size: 10px; color: var(--text-4);">24px</span>
        <div style="height: 14px; width: 96px; background: linear-gradient(90deg, var(--accent), var(--lilac)); border-radius: 4px; opacity: 0.7;"></div>
      </div>
    
      <div style="display: flex; align-items: center; gap: 14px;">
        <span class="mono" style="width: 56px; font-size: 10px; color: var(--text-3); letter-spacing: 0.02em;">--s-8</span>
        <span class="mono" style="width: 40px; font-size: 10px; color: var(--text-4);">32px</span>
        <div style="height: 14px; width: 128px; background: linear-gradient(90deg, var(--accent), var(--lilac)); border-radius: 4px; opacity: 0.7;"></div>
      </div>
    
      <div style="display: flex; align-items: center; gap: 14px;">
        <span class="mono" style="width: 56px; font-size: 10px; color: var(--text-3); letter-spacing: 0.02em;">--s-10</span>
        <span class="mono" style="width: 40px; font-size: 10px; color: var(--text-4);">40px</span>
        <div style="height: 14px; width: 160px; background: linear-gradient(90deg, var(--accent), var(--lilac)); border-radius: 4px; opacity: 0.7;"></div>
      </div>
    
      <div style="display: flex; align-items: center; gap: 14px;">
        <span class="mono" style="width: 56px; font-size: 10px; color: var(--text-3); letter-spacing: 0.02em;">--s-12</span>
        <span class="mono" style="width: 40px; font-size: 10px; color: var(--text-4);">48px</span>
        <div style="height: 14px; width: 192px; background: linear-gradient(90deg, var(--accent), var(--lilac)); border-radius: 4px; opacity: 0.7;"></div>
      </div>
    
      <div style="display: flex; align-items: center; gap: 14px;">
        <span class="mono" style="width: 56px; font-size: 10px; color: var(--text-3); letter-spacing: 0.02em;">--s-16</span>
        <span class="mono" style="width: 40px; font-size: 10px; color: var(--text-4);">64px</span>
        <div style="height: 14px; width: 256px; background: linear-gradient(90deg, var(--accent), var(--lilac)); border-radius: 4px; opacity: 0.7;"></div>
      </div>
    
  </div>
</div>

</body>
</html>
