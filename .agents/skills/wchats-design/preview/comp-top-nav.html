<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Top nav</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..800,0..100&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
<style>
html, body { width: 700px; height: 110px; }
.btn { font-family: var(--font-sans); font-size: 14px; font-weight: 600; letter-spacing: -0.005em; padding: 10px 18px; border-radius: 8px; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 8px; transition: all 0.15s ease; white-space: nowrap; }
.btn-primary { background: var(--accent); color: var(--text-on-accent); box-shadow: 0 0 0 1px var(--accent-deep) inset, var(--shadow-glow); }
.btn-ghost { background: transparent; color: var(--text-1); border: 1px solid var(--border); }
.btn-secondary { background: var(--surface-2); color: var(--text-1); border: 1px solid var(--border); }
.btn-sm { font-size: 12.5px; padding: 7px 14px; }
.btn-lg { font-size: 15px; padding: 13px 24px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; padding: 4px 10px; border-radius: 100px; }
.chip .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip-live   { background: var(--green-bg);  color: var(--green);  border: 1px solid var(--green-border); }
.chip-test   { background: var(--gold-bg);   color: var(--gold);   border: 1px solid var(--gold-border); }
.chip-draft  { background: var(--surface-2); color: var(--text-3); border: 1px solid var(--border-soft); }
.chip-red    { background: var(--red-bg);    color: var(--red);    border: 1px solid var(--red-border); }
.chip-coral  { background: var(--accent-dim);color: var(--accent); border: 1px solid rgba(244,116,140,0.25); }
.chip-cyan   { background: var(--cyan-dim);  color: var(--cyan);   border: 1px solid rgba(94,223,211,0.25); }
.chip-lilac  { background: var(--lilac-dim); color: var(--lilac);  border: 1px solid rgba(183,154,224,0.25); }

</style>
</head>
<body>

<div style="height: 100%; padding: 8px;">
  <nav style="height: 60px; background: var(--bg-elev); border: 1px solid var(--border-soft); border-radius: 12px; display: flex; align-items: center; padding: 0 18px; gap: 4px;">
    <div style="display: flex; align-items: center; gap: 10px; margin-right: 24px;">
      <div style="width: 30px; height: 30px; background: linear-gradient(135deg, var(--accent) 0%, var(--accent-deep) 100%); border-radius: 8px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 1px rgba(244,116,140,0.25), 0 4px 16px rgba(244,116,140,0.25);">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </div>
      <span style="font-family: var(--font-display); font-size: 17px; font-weight: 500; font-variation-settings: 'opsz' 144, 'SOFT' 50; color: var(--text-1); letter-spacing: -0.015em;">w<span style="color: var(--accent);">.</span>chats</span>
    </div>
    <a style="padding: 7px 12px; font-size: 13px; font-weight: 600; color: var(--text-1); background: var(--accent-dim); border-radius: 8px;">Agents</a>
    <a style="padding: 7px 12px; font-size: 13px; font-weight: 500; color: var(--text-3); border-radius: 8px;">Insights</a>
    <a style="padding: 7px 12px; font-size: 13px; font-weight: 500; color: var(--text-3); border-radius: 8px;">Evals</a>
    <a style="padding: 7px 12px; font-size: 13px; font-weight: 500; color: var(--text-3); border-radius: 8px;">Billing</a>
    <div style="margin-left: auto; display: flex; align-items: center; gap: 8px;">
      <div style="width: 32px; height: 32px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-1); display: flex; align-items: center; justify-content: center; color: var(--text-3);">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </div>
      <div style="width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, var(--lilac), var(--lilac-deep)); display: flex; align-items: center; justify-content: center; color: var(--text-on-accent); font-size: 12px; font-weight: 700; box-shadow: 0 0 0 1px var(--border);">F</div>
    </div>
  </nav>
</div>

</body>
</html>
