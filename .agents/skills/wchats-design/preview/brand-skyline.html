<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hero · skyline background</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..800,0..100&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
<style>
html, body { width: 1100px; height: 460px; }

</style>
</head>
<body>

<div style="position: absolute; inset: 0;">
  <div style="position: absolute; inset: 0; background: url('../assets/skyline-w-chats.png') center bottom / cover no-repeat;"></div>
  <div style="position: absolute; inset: 0; background:
    linear-gradient(180deg, rgba(11,7,23,0.65) 0%, rgba(11,7,23,0.35) 25%, rgba(11,7,23,0.15) 50%, rgba(11,7,23,0.45) 80%, rgba(11,7,23,0.85) 100%),
    radial-gradient(ellipse 70% 80% at 50% 60%, transparent 0%, rgba(11,7,23,0.4) 100%);"></div>
</div>
<div style="position: relative; z-index: 1; height: 100%; padding: 36px 40px; display: flex; flex-direction: column; justify-content: space-between;">
  <div style="display: flex; gap: 10px;">
    <span style="display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 10px; background: rgba(30,22,56,0.55); backdrop-filter: blur(24px) saturate(140%); -webkit-backdrop-filter: blur(24px) saturate(140%); border: 1px solid rgba(244,232,220,0.10); border-radius: 100px; font-size: 10.5px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #C4BCD0;">
      <span style="width: 6px; height: 6px; border-radius: 50%; background: #6FE8AA; box-shadow: 0 0 8px #6FE8AA;"></span>
      <span><strong style="color: #F4EDE5;">Open source</strong>&nbsp;·&nbsp;v0.4.2&nbsp;·&nbsp;M8</span>
    </span>
  </div>
  <div>
    <h1 style="font-family: 'Fraunces', serif; font-size: 60px; font-weight: 400; font-variation-settings: 'opsz' 144, 'SOFT' 30; letter-spacing: -0.035em; line-height: 0.98; color: #F4EDE5; margin: 0;">
      The chat widget<br>
      <span style="text-decoration: line-through; text-decoration-color: #F4748C; text-decoration-thickness: 3px; color: #8A82A0;">is the hard part.</span><br>
      <em style="font-style: italic; font-weight: 300; color: #F4748C; font-variation-settings: 'opsz' 144, 'SOFT' 100;">The layer underneath is.</em>
    </h1>
  </div>
  <div style="display: flex; gap: 18px; padding-top: 16px; border-top: 1px solid rgba(244,232,220,0.10);">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 600; color: #F4EDE5;">&lt;30<span style="color: #F4748C; font-weight: 500; margin-left: 1px;">min</span></span>
      <span style="font-size: 9.5px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: #8A82A0;">Signup to deployed</span>
    </div>
    <span style="width: 1px; height: 28px; background: rgba(244,232,220,0.10);"></span>
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 600; color: #F4EDE5;">&gt;0.85</span>
      <span style="font-size: 9.5px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: #8A82A0;">Faithfulness</span>
    </div>
    <span style="width: 1px; height: 28px; background: rgba(244,232,220,0.10);"></span>
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 600; color: #F4EDE5;">0<span style="color: #F4748C; font-weight: 500; margin-left: 1px;">crit</span></span>
      <span style="font-size: 9.5px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: #8A82A0;">Red team threshold</span>
    </div>
  </div>
</div>

</body>
</html>
