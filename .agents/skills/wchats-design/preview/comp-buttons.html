<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Buttons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..800,0..100&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
<style>
html, body { width: 700px; height: 220px; }
.btn { font-family: var(--font-sans); font-size: 14px; font-weight: 600; letter-spacing: -0.005em; padding: 10px 18px; border-radius: 8px; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 8px; transition: all 0.15s ease; white-space: nowrap; }
.btn-primary { background: var(--accent); color: var(--text-on-accent); box-shadow: 0 0 0 1px var(--accent-deep) inset, var(--shadow-glow); }
.btn-ghost { background: transparent; color: var(--text-1); border: 1px solid var(--border); }
.btn-secondary { background: var(--surface-2); color: var(--text-1); border: 1px solid var(--border); }
.btn-sm { font-size: 12.5px; padding: 7px 14px; }
.btn-lg { font-size: 15px; padding: 13px 24px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; padding: 4px 10px; border-radius: 100px; }
.chip .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip-live   { background: var(--green-bg);  color: var(--green);  border: 1px solid var(--green-border); }
.chip-test   { background: var(--gold-bg);   color: var(--gold);   border: 1px solid var(--gold-border); }
.chip-draft  { background: var(--surface-2); color: var(--text-3); border: 1px solid var(--border-soft); }
.chip-red    { background: var(--red-bg);    color: var(--red);    border: 1px solid var(--red-border); }
.chip-coral  { background: var(--accent-dim);color: var(--accent); border: 1px solid rgba(244,116,140,0.25); }
.chip-cyan   { background: var(--cyan-dim);  color: var(--cyan);   border: 1px solid rgba(94,223,211,0.25); }
.chip-lilac  { background: var(--lilac-dim); color: var(--lilac);  border: 1px solid rgba(183,154,224,0.25); }

</style>
</head>
<body>

<div style="display: flex; flex-direction: column; gap: 16px; height: 100%; justify-content: center;">
  <div class="label">Buttons</div>
  <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
    <button class="btn btn-primary btn-lg">Build your agent <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></button>
    <button class="btn btn-ghost btn-lg"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg> Watch the build <span class="mono" style="color:var(--text-4);font-size:11px;margin-left:2px;">2:18</span></button>
  </div>
  <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
    <button class="btn btn-primary">Start free <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></button>
    <button class="btn btn-ghost">Sign in</button>
    <button class="btn btn-secondary">View details</button>
    <button class="btn btn-primary btn-sm">Start free</button>
    <button class="btn btn-ghost btn-sm">Cancel</button>
  </div>
  <div style="display: flex; gap: 18px; padding-top: 14px; border-top: 1px solid var(--border-soft); font-size: 10.5px; color: var(--text-4); font-family: var(--font-mono);">
    <span>Primary · coral with deep inset rim + glow</span>
    <span>Ghost · transparent · 1px border</span>
    <span>Secondary · surface-2 fill</span>
  </div>
</div>

</body>
</html>
