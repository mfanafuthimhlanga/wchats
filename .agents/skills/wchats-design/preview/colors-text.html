<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Text on dark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..800,0..100&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
<style>
html, body { width: 700px; height: 200px; }

</style>
</head>
<body>

<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px; height: 100%;">
  
    <div style="background: var(--bg); border: 1px solid var(--border-soft); border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; justify-content: center;">
      <div style="color: #F4EDE5; font-size: 18px; font-weight: 500; letter-spacing: -0.01em;">The skyline burns coral.</div>
      <div style="display: flex; gap: 10px; align-items: baseline;">
        <span style="font-size: 11px; font-weight: 600; color: var(--text-1);">--text-1</span>
        <span class="mono" style="font-size: 10px; color: var(--text-3);">#F4EDE5</span>
      </div>
      <span style="font-size: 10.5px; color: var(--text-4);">primary · warm off-white</span>
    </div>
  
    <div style="background: var(--bg); border: 1px solid var(--border-soft); border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; justify-content: center;">
      <div style="color: #C4BCD0; font-size: 18px; font-weight: 500; letter-spacing: -0.01em;">The skyline burns coral.</div>
      <div style="display: flex; gap: 10px; align-items: baseline;">
        <span style="font-size: 11px; font-weight: 600; color: var(--text-1);">--text-2</span>
        <span class="mono" style="font-size: 10px; color: var(--text-3);">#C4BCD0</span>
      </div>
      <span style="font-size: 10.5px; color: var(--text-4);">secondary · cool lavender-white</span>
    </div>
  
    <div style="background: var(--bg); border: 1px solid var(--border-soft); border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; justify-content: center;">
      <div style="color: #8A82A0; font-size: 18px; font-weight: 500; letter-spacing: -0.01em;">The skyline burns coral.</div>
      <div style="display: flex; gap: 10px; align-items: baseline;">
        <span style="font-size: 11px; font-weight: 600; color: var(--text-1);">--text-3</span>
        <span class="mono" style="font-size: 10px; color: var(--text-3);">#8A82A0</span>
      </div>
      <span style="font-size: 10.5px; color: var(--text-4);">muted · captions, labels</span>
    </div>
  
    <div style="background: var(--bg); border: 1px solid var(--border-soft); border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; justify-content: center;">
      <div style="color: #5A5470; font-size: 18px; font-weight: 500; letter-spacing: -0.01em;">The skyline burns coral.</div>
      <div style="display: flex; gap: 10px; align-items: baseline;">
        <span style="font-size: 11px; font-weight: 600; color: var(--text-1);">--text-4</span>
        <span class="mono" style="font-size: 10px; color: var(--text-3);">#5A5470</span>
      </div>
      <span style="font-size: 10.5px; color: var(--text-4);">very muted · labels on labels</span>
    </div>
  
</div>

</body>
</html>
