<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Italic accent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..800,0..100&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
<style>
html, body { width: 700px; height: 200px; }

</style>
</head>
<body>

<div style="height: 100%; display: flex; flex-direction: column; gap: 16px; justify-content: center;">
  <div class="label" style="color: var(--accent);">Italic · the brand turn</div>
  <div style="font-family: var(--font-display); font-size: 30px; font-weight: 400; line-height: 1.15; letter-spacing: -0.022em; color: var(--text-1); font-variation-settings: 'opsz' 144, 'SOFT' 50;">
    Agents that <em style="font-style: italic; font-weight: 300; color: var(--accent); font-variation-settings: 'opsz' 144, 'SOFT' 100;">earn</em><br>
    the right to ship.
  </div>
  <div style="display: flex; gap: 16px; padding-top: 12px; border-top: 1px solid var(--border-soft); font-size: 11px; color: var(--text-3);">
    <span><strong style="color: var(--text-2); font-weight: 500;">Upright</strong> · 400 weight · SOFT 30</span>
    <span><strong style="color: var(--accent); font-weight: 500;">Italic accent</strong> · 300 weight italic · SOFT 100 (softer terminals)</span>
  </div>
</div>

</body>
</html>
