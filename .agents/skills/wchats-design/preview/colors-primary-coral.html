<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Primary coral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..800,0..100&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
<style>
html, body { width: 700px; height: 200px; }

</style>
</head>
<body>

<div class="row" style="gap: 14px; height: 100%; align-items: stretch;">
  
    <div style="flex:1; display:flex; flex-direction:column; gap:10px;">
      <div style="flex:1; border-radius: 14px; background: #F4748C;  min-height: 90px;">
        
      </div>
      <div style="display:flex; flex-direction:column; gap: 2px;">
        <span style="font-size: 11px; font-weight: 600; color: var(--text-1);">--accent</span>
        <span class="mono" style="font-size: 10px; color: var(--text-3); white-space: nowrap;">#F4748C</span>
        <span style="font-size: 10px; color: var(--text-4);">primary</span>
      </div>
    </div>
  
    <div style="flex:1; display:flex; flex-direction:column; gap:10px;">
      <div style="flex:1; border-radius: 14px; background: #FF8AA0;  min-height: 90px;">
        
      </div>
      <div style="display:flex; flex-direction:column; gap: 2px;">
        <span style="font-size: 11px; font-weight: 600; color: var(--text-1);">--accent-hover</span>
        <span class="mono" style="font-size: 10px; color: var(--text-3); white-space: nowrap;">#FF8AA0</span>
        <span style="font-size: 10px; color: var(--text-4);">hover</span>
      </div>
    </div>
  
    <div style="flex:1; display:flex; flex-direction:column; gap:10px;">
      <div style="flex:1; border-radius: 14px; background: #C8485E;  min-height: 90px;">
        
      </div>
      <div style="display:flex; flex-direction:column; gap: 2px;">
        <span style="font-size: 11px; font-weight: 600; color: var(--text-1);">--accent-deep</span>
        <span class="mono" style="font-size: 10px; color: var(--text-3); white-space: nowrap;">#C8485E</span>
        <span style="font-size: 10px; color: var(--text-4);">pressed</span>
      </div>
    </div>
  
    <div style="flex:1; display:flex; flex-direction:column; gap:10px;">
      <div style="flex:1; border-radius: 14px; background: #8E2A40;  min-height: 90px;">
        
      </div>
      <div style="display:flex; flex-direction:column; gap: 2px;">
        <span style="font-size: 11px; font-weight: 600; color: var(--text-1);">--accent-dark</span>
        <span class="mono" style="font-size: 10px; color: var(--text-3); white-space: nowrap;">#8E2A40</span>
        <span style="font-size: 10px; color: var(--text-4);">deep</span>
      </div>
    </div>
  
    <div style="flex:1; display:flex; flex-direction:column; gap:10px;">
      <div style="flex:1; border-radius: 14px; background: #1c1029; box-shadow: inset 0 0 0 1px var(--border); position:relative; min-height: 90px;">
        <div style="position:absolute; inset:8px; border-radius:8px; background:rgba(244,116,140,0.10);"></div>
      </div>
      <div style="display:flex; flex-direction:column; gap: 2px;">
        <span style="font-size: 11px; font-weight: 600; color: var(--text-1);">--accent-dim</span>
        <span class="mono" style="font-size: 10px; color: var(--text-3); white-space: nowrap;">rgba(244…)</span>
        <span style="font-size: 10px; color: var(--text-4);">dim fill</span>
      </div>
    </div>
  
    <div style="flex:1; display:flex; flex-direction:column; gap:10px;">
      <div style="flex:1; border-radius: 14px; background: #1c1029; box-shadow: inset 0 0 0 1px var(--border); position:relative; min-height: 90px;">
        <div style="position:absolute; inset:8px; border-radius:8px; background:rgba(244,116,140,0.32);"></div>
      </div>
      <div style="display:flex; flex-direction:column; gap: 2px;">
        <span style="font-size: 11px; font-weight: 600; color: var(--text-1);">--accent-glow</span>
        <span class="mono" style="font-size: 10px; color: var(--text-3); white-space: nowrap;">rgba(244…)</span>
        <span style="font-size: 10px; color: var(--text-4);">glow</span>
      </div>
    </div>
  
</div>

</body>
</html>
