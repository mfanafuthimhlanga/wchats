<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Iconography · Feather line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..800,0..100&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
<style>
html, body { width: 700px; height: 220px; }

</style>
</head>
<body>

<div style="display: flex; flex-direction: column; gap: 14px; height: 100%;">
  <div style="display: flex; align-items: baseline; gap: 14px;">
    <span class="label" style="color: var(--accent);">Feather-style line icons</span>
    <span class="mono" style="font-size: 10px; color: var(--text-3);">stroke-width 2 · round caps · currentColor</span>
  </div>
  <div style="display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px; flex: 1;">
    
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px 6px; border: 1px solid var(--border-soft); border-radius: 10px; background: var(--surface-1);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        <span class="mono" style="font-size: 8.5px; color: var(--text-4); letter-spacing: 0.02em; text-align: center;">chat-bubble</span>
      </div>
    
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px 6px; border: 1px solid var(--border-soft); border-radius: 10px; background: var(--surface-1);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
        </svg>
        <span class="mono" style="font-size: 8.5px; color: var(--text-4); letter-spacing: 0.02em; text-align: center;">arrow-right</span>
      </div>
    
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px 6px; border: 1px solid var(--border-soft); border-radius: 10px; background: var(--surface-1);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
        <span class="mono" style="font-size: 8.5px; color: var(--text-4); letter-spacing: 0.02em; text-align: center;">play</span>
      </div>
    
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px 6px; border: 1px solid var(--border-soft); border-radius: 10px; background: var(--surface-1);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        <span class="mono" style="font-size: 8.5px; color: var(--text-4); letter-spacing: 0.02em; text-align: center;">check</span>
      </div>
    
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px 6px; border: 1px solid var(--border-soft); border-radius: 10px; background: var(--surface-1);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        <span class="mono" style="font-size: 8.5px; color: var(--text-4); letter-spacing: 0.02em; text-align: center;">plus</span>
      </div>
    
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px 6px; border: 1px solid var(--border-soft); border-radius: 10px; background: var(--surface-1);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <span class="mono" style="font-size: 8.5px; color: var(--text-4); letter-spacing: 0.02em; text-align: center;">search</span>
      </div>
    
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px 6px; border: 1px solid var(--border-soft); border-radius: 10px; background: var(--surface-1);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <span class="mono" style="font-size: 8.5px; color: var(--text-4); letter-spacing: 0.02em; text-align: center;">bell</span>
      </div>
    
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px 6px; border: 1px solid var(--border-soft); border-radius: 10px; background: var(--surface-1);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>
        </svg>
        <span class="mono" style="font-size: 8.5px; color: var(--text-4); letter-spacing: 0.02em; text-align: center;">trend-up</span>
      </div>
    
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px 6px; border: 1px solid var(--border-soft); border-radius: 10px; background: var(--surface-1);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
        <span class="mono" style="font-size: 8.5px; color: var(--text-4); letter-spacing: 0.02em; text-align: center;">shield-check</span>
      </div>
    
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px 6px; border: 1px solid var(--border-soft); border-radius: 10px; background: var(--surface-1);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
        </svg>
        <span class="mono" style="font-size: 8.5px; color: var(--text-4); letter-spacing: 0.02em; text-align: center;">clock</span>
      </div>
    
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px 6px; border: 1px solid var(--border-soft); border-radius: 10px; background: var(--surface-1);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <span class="mono" style="font-size: 8.5px; color: var(--text-4); letter-spacing: 0.02em; text-align: center;">upload</span>
      </div>
    
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px 6px; border: 1px solid var(--border-soft); border-radius: 10px; background: var(--surface-1);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
        <span class="mono" style="font-size: 8.5px; color: var(--text-4); letter-spacing: 0.02em; text-align: center;">bolt</span>
      </div>
    
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px 6px; border: 1px solid var(--border-soft); border-radius: 10px; background: var(--surface-1);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>
        </svg>
        <span class="mono" style="font-size: 8.5px; color: var(--text-4); letter-spacing: 0.02em; text-align: center;">code</span>
      </div>
    
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px 6px; border: 1px solid var(--border-soft); border-radius: 10px; background: var(--surface-1);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 11H1l3-9 4 6h7l-3 9-4-6z"/>
        </svg>
        <span class="mono" style="font-size: 8.5px; color: var(--text-4); letter-spacing: 0.02em; text-align: center;">lightning</span>
      </div>
    
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px 6px; border: 1px solid var(--border-soft); border-radius: 10px; background: var(--surface-1);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <span class="mono" style="font-size: 8.5px; color: var(--text-4); letter-spacing: 0.02em; text-align: center;">lock</span>
      </div>
    
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px 6px; border: 1px solid var(--border-soft); border-radius: 10px; background: var(--surface-1);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
        </svg>
        <span class="mono" style="font-size: 8.5px; color: var(--text-4); letter-spacing: 0.02em; text-align: center;">cart</span>
      </div>
    
  </div>
</div>

</body>
</html>
