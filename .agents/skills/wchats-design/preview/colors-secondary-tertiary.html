<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secondary scales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..800,0..100&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
<style>
html, body { width: 700px; height: 200px; }

</style>
</head>
<body>

<div class="row" style="gap: 14px; height: 100%; align-items: stretch;">
  
    <div style="flex:1; display:flex; flex-direction:column; gap:10px;">
      <div style="flex:1; border-radius: 14px; background: #B79AE0; min-height: 90px;"></div>
      <div style="display:flex; flex-direction:column; gap: 2px;">
        <span style="font-size: 11px; font-weight: 600; color: var(--text-1);">--lilac</span>
        <span class="mono" style="font-size: 10px; color: var(--text-3);">#B79AE0</span>
        <span style="font-size: 10px; color: var(--text-4);">jacaranda</span>
      </div>
    </div>
  
    <div style="flex:1; display:flex; flex-direction:column; gap:10px;">
      <div style="flex:1; border-radius: 14px; background: #8E72B8; min-height: 90px;"></div>
      <div style="display:flex; flex-direction:column; gap: 2px;">
        <span style="font-size: 11px; font-weight: 600; color: var(--text-1);">--lilac-deep</span>
        <span class="mono" style="font-size: 10px; color: var(--text-3);">#8E72B8</span>
        <span style="font-size: 10px; color: var(--text-4);">deep</span>
      </div>
    </div>
  
    <div style="flex:1; display:flex; flex-direction:column; gap:10px;">
      <div style="flex:1; border-radius: 14px; background: #5EDFD3; min-height: 90px;"></div>
      <div style="display:flex; flex-direction:column; gap: 2px;">
        <span style="font-size: 11px; font-weight: 600; color: var(--text-1);">--cyan</span>
        <span class="mono" style="font-size: 10px; color: var(--text-3);">#5EDFD3</span>
        <span style="font-size: 10px; color: var(--text-4);">tower (rare)</span>
      </div>
    </div>
  
    <div style="flex:1; display:flex; flex-direction:column; gap:10px;">
      <div style="flex:1; border-radius: 14px; background: #3AB8AC; min-height: 90px;"></div>
      <div style="display:flex; flex-direction:column; gap: 2px;">
        <span style="font-size: 11px; font-weight: 600; color: var(--text-1);">--cyan-deep</span>
        <span class="mono" style="font-size: 10px; color: var(--text-3);">#3AB8AC</span>
        <span style="font-size: 10px; color: var(--text-4);">deep</span>
      </div>
    </div>
  
    <div style="flex:1; display:flex; flex-direction:column; gap:10px;">
      <div style="flex:1; border-radius: 14px; background: #E8A87C; min-height: 90px;"></div>
      <div style="display:flex; flex-direction:column; gap: 2px;">
        <span style="font-size: 11px; font-weight: 600; color: var(--text-1);">--amber</span>
        <span class="mono" style="font-size: 10px; color: var(--text-3);">#E8A87C</span>
        <span style="font-size: 10px; color: var(--text-4);">building light</span>
      </div>
    </div>
  
    <div style="flex:1; display:flex; flex-direction:column; gap:10px;">
      <div style="flex:1; border-radius: 14px; background: #B87850; min-height: 90px;"></div>
      <div style="display:flex; flex-direction:column; gap: 2px;">
        <span style="font-size: 11px; font-weight: 600; color: var(--text-1);">--amber-deep</span>
        <span class="mono" style="font-size: 10px; color: var(--text-3);">#B87850</span>
        <span style="font-size: 10px; color: var(--text-4);">deep</span>
      </div>
    </div>
  
</div>

</body>
</html>
