# Alembic configuration for the control DB
# sqlalchemy.url is left as a placeholder — overridden at runtime via:
#   1. CLI: set DATABASE_URL env var or pass --config
#   2. Programmatic: engine_from_config or config.attributes['connection'] injection

[alembic]
# Path to the alembic migration scripts directory
script_location = alembic

# Template for migration file names
file_template = %%(rev)s_%%(slug)s

# Truncation for the slug
truncate_slug_length = 40

# Logging format
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
