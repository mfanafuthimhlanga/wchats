# Railway config as code for the pipeline worker (ADR 0005, ticket 18).
#
# Consumes the `pipeline` queue only: ingestion and build. Built from
# Dockerfile.pipeline, which adds torch (CPU) and docling, about 3 GB. On the
# trial budget, add this service for the hour an upload is being tested and
# remove it afterwards; it idles at far more RAM than the other three.
#
# UI fields, once per service:
#   Settings > Source > Root Directory        apps/api
#
# WHETHER RAILWAY READS THIS FILE AT ALL IS NOT GUARANTEED (#139). Config as
# Code is deprecated; existing files keep working until 2026-12-01, and a
# service that has never used it cannot opt in since 2026-08-28. Where the
# section is closed, this file is the record the operator types from, field by
# field, and `scripts/railway_staging_wizard.sh` reads the values out of it so
# the two cannot disagree. A change here then does NOT reach Railway on its own.
# Variables this service needs beyond the shared set (docker-compose.yml sets
# the same two for the local pipeline worker):
#   LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu
#   HF_HUB_DISABLE_XET_ENDPOINT=1
# No public networking; no health check.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.pipeline"
watchPatterns = ["apps/api/**"]

[deploy]
startCommand = "celery -A app.worker.celery_app worker --queues=pipeline --hostname=pipeline@%h --loglevel=info --concurrency=1"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
