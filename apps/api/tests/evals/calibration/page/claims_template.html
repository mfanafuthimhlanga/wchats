<meta charset="utf-8">
<title>Claims Bench</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&family=Newsreader:ital,wght@1,400&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #0E1012; --surface: #15181B; --surface-2: #1E2327; --well: #08090B;
    --hairline: rgba(231,229,225,0.13); --hairline-soft: rgba(231,229,225,0.06); --hairline-strong: rgba(231,229,225,0.42);
    --ink: #E7E5E1; --ink-2: #9BA1A3; --ink-3: #7E8588;
    --live: #E7E5E1; --live-hot: #FFFFFF; --live-ink: #0E1012;
    --pass: #4CC38A; --fail: #E5484D;
    --display: 'Space Grotesk', system-ui, sans-serif; --sans: 'Inter', system-ui, sans-serif;
    --voice: 'Newsreader', Georgia, serif; --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 13.5px; line-height: 1.55; padding-inline: 16px; padding-block: 0; margin: 0; }
  h1, h2, h3 { margin: 0; font-family: var(--display); font-weight: 500; letter-spacing: -0.02em; text-wrap: balance; }
  .eyebrow { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding-block: 18px 12px; border-bottom: 1px solid var(--hairline); }
  header h1 { font-size: 20px; }
  header .progress { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .cells { display: grid; grid-template-columns: repeat(auto-fill, 6px); gap: 2px; width: var(--cw-narrow, 182px); }
  .cell { height: 10px; background: transparent; border: 1px solid var(--hairline-strong); border-radius: 1px; }
  .cell.full { background: var(--live); border-color: transparent; }
  .cell.full.yes { background: var(--pass); }
  .cell.full.no { background: var(--fail); }
  .cell.here { border-color: var(--live-hot); }
  .count { font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
  .save { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); min-width: 9ch; }
  .save.warn { color: var(--fail); }

  main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0 24px; min-height: 0; }
  nav { display: none; border-right: 1px solid var(--hairline); padding-block: 12px; overflow-y: auto; max-height: calc(100vh - 70px); position: sticky; top: 0; }
  nav ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .row { display: grid; width: 100%; grid-template-columns: 3ch 1fr auto; gap: 8px; align-items: start; text-align: left; padding: 7px 10px 7px 0; background: transparent; border: 0; border-bottom: 1px solid var(--hairline-soft); color: var(--ink-2); font: inherit; cursor: pointer; }
  .row:hover { background: var(--surface); color: var(--ink); }
  .row.here { color: var(--live-hot); background: var(--surface-2); }
  .row .n { font-family: var(--mono); font-size: 11px; color: var(--ink-2); text-align: right; padding-top: 3px; }
  .row .q { font-size: 12px; min-width: 0; }
  .row .qt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: normal; }
  .row .k { font-family: var(--mono); font-size: 10px; color: var(--ink-3); padding-top: 4px; white-space: nowrap; }
  .row .k.done { color: var(--ink-2); }

  section.scenario { padding-block: 18px 24px; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
  .block { display: flex; flex-direction: column; gap: 6px; }
  .question { font-family: var(--display); font-size: 18px; line-height: 1.45; max-width: 68ch; }
  .response { max-width: 78ch; font-size: 14px; line-height: 1.6; background: var(--surface); padding: 12px 16px; }
  .sent { display: block; border-left: 3px solid transparent; padding: 2px 0 2px 10px; }
  .sent + .sent { margin-top: 2px; }
  .sent.para { margin-top: 10px; }
  .sent.li, .sent.cont { padding-left: 24px; }
  .sent.li { text-indent: -14px; }
  .sent .bu { color: var(--ink-3); }
  .sent.t-bone { border-left-color: var(--live); }
  .sent.t-grey { border-left-color: var(--ink-3); }
  .sent.t-fail { border-left-color: var(--fail); }
  .sent[data-s] { cursor: pointer; }
  .sent[data-s]:hover, .sent.on { background: var(--surface-2); }
  .sent.code { font-family: var(--mono); font-size: 11.5px; line-height: 1.6; white-space: pre-wrap; overflow-x: auto; background: var(--well); padding: 8px 0 8px 10px; margin-top: 8px; }
  .sent.cite { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); white-space: pre-wrap; margin-top: 12px; }
  .response code, .pw code { font-family: var(--mono); font-size: 0.88em; background: var(--surface-2); padding: 0 3px; border-radius: 2px; }
  .legend { font-size: 11px; line-height: 1.5; color: var(--ink-3); }
  .legend b { font-weight: 600; }
  .k-bone { color: var(--live); } .k-grey { color: var(--ink-2); } .k-fail { color: var(--fail); } .k-none { color: var(--ink-2); }

  .ctxcol { min-width: 0; display: flex; flex-direction: column; gap: 6px; padding-block: 18px 12px; }
  .ctxnote { font-size: 11.5px; color: var(--fail); }
  .ctxpane { min-height: 0; max-height: 70vh; overflow-y: auto; background: var(--well); border: 1px solid var(--hairline); }
  .ctxblock { padding: 10px 14px 10px 8px; }
  .ctxblock + .ctxblock { border-top: 1px solid var(--hairline); }
  .pw { margin: 0 0 8px; padding-left: 9px; border-left: 3px solid transparent; font-size: 12.5px; line-height: 1.6; color: var(--ink-2); white-space: pre-wrap; overflow-wrap: anywhere; }
  .pw:last-child { margin-bottom: 0; }
  .pw.lit { border-left-color: var(--live); color: var(--ink); }
  .pw b { color: var(--ink); font-weight: 600; }
  .pw .cx { font-family: var(--mono); font-size: 0.9em; }
  mark { background: rgba(231,229,225,0.22); color: var(--live-hot); border-radius: 1px; padding: 0 1px; }

  .claims { display: flex; flex-direction: column; gap: 12px; padding-block: 18px 40px; }
  .rubric { color: var(--ink-2); font-size: 12.5px; line-height: 1.5; }
  .card { display: flex; flex-direction: column; gap: 10px; background: var(--surface); border: 1px solid var(--hairline-strong); padding: 12px 14px; cursor: default; }
  .card.active { border-color: var(--live-hot); box-shadow: inset 0 0 0 1px var(--live-hot); }
  .card h3 { font-size: 12.5px; color: var(--ink-2); display: flex; gap: 8px; align-items: center; }
  .statement { font-family: var(--voice); font-style: italic; font-size: 15px; line-height: 1.5; }
  .overlap { font-family: var(--mono); font-size: 10.5px; }
  .seg { display: flex; gap: 6px; }
  button { font: inherit; cursor: pointer; }
  .vbtn { flex: 1; min-width: 0; font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: 0.08em; padding: 8px 0; background: transparent; border: 1px solid var(--hairline-strong); color: var(--ink-2); border-radius: 2px; }
  .vbtn:hover { color: var(--ink); background: var(--surface-2); }
  .vbtn.yes.on, .vbtn.yes.on:hover { background: var(--pass); border-color: var(--pass); color: var(--live-ink); }
  .vbtn.no.on, .vbtn.no.on:hover { background: var(--fail); border-color: var(--fail); color: var(--live-ink); }
  .bulk { display: flex; gap: 6px; align-items: center; }
  .bulk .btn { flex: 1; }
  .btn { font-family: var(--sans); font-size: 12.5px; font-weight: 600; padding: 7px 14px; background: transparent; border: 1px solid var(--hairline-strong); color: var(--ink); border-radius: 2px; }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--live); color: var(--live-ink); border-color: var(--live); }
  .btn.primary:hover { background: var(--live-hot); }
  .btn:disabled { opacity: 0.35; cursor: default; }
  .navbtns { display: flex; gap: 6px; }
  .navbtns .btn { flex: 1; }
  :focus-visible { outline: 2px solid var(--live-hot); outline-offset: 2px; }
  .kbd { font-family: var(--mono); font-size: 10px; color: var(--ink-3); }
  .kbd b { display: inline-block; border: 1px solid var(--hairline-strong); padding: 0 5px; border-radius: 2px; color: var(--ink-2); font-weight: 400; }

  .strip { display: none; position: sticky; bottom: 0; z-index: 5; flex-direction: column; gap: 6px; margin-inline: -16px; padding: 8px 16px; background: var(--surface); border-top: 1px solid var(--hairline-strong); }
  .strow { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .strip .slabel { font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--ink-2); flex: none; }
  .strip .sstatement { font-family: var(--voice); font-style: italic; font-size: 13px; min-width: 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .strip .vbtn { padding: 6px 0; font-size: 11px; }
  .strip .btn { padding: 6px 10px; }

  @media (max-width: 860px) { .kbd { display: none; } }
  @media (min-width: 1180px) {
    main { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 300px; gap: 0 18px; }
    .ctxcol, .claims { position: sticky; top: 12px; align-self: start; max-height: calc(100vh - 24px); }
    .claims { overflow-y: auto; }
    .ctxpane { max-height: calc(100vh - 78px); }
  }
  @media (min-width: 1400px) {
    main { grid-template-columns: 236px minmax(0, 1fr) minmax(0, 1fr) 300px; }
    nav { display: block; }
  }
  @media (max-width: 1179px) { .strip { display: flex; } .claims .navbtns { display: none; } }
  @media (prefers-reduced-motion: no-preference) { .vbtn, .btn { transition: background 120ms, color 120ms; } }
</style>

<header>
  <h1>Claims Bench</h1>
  <span class="kbd"><b>&larr;</b> <b>&rarr;</b> answer &middot; <b>j</b> <b>k</b> sentence &middot; <b>Tab</b> claim &middot; <b>y</b> yes &middot; <b>n</b> no &middot; <b>N</b> no to all</span>
  <div class="progress">
    <div class="cells" id="cells"></div>
    <span class="count" id="count" aria-live="polite"></span>
    <span class="save" id="save" aria-live="polite">connecting</span>
  </div>
</header>

<main>
  <nav aria-label="answers"><ol id="list"></ol></nav>
  <section class="scenario" id="scenario"></section>
  <aside class="ctxcol" aria-label="retrieved text">
    <div class="eyebrow"><span>retrieved text</span></div>
    <div class="ctxnote" id="ctxnote" aria-live="polite" hidden></div>
    <div class="ctxpane" id="ctxpane"></div>
  </aside>
  <aside class="claims" id="claims" aria-label="flagged claims"></aside>
</main>
<div class="strip" id="strip" role="group" aria-label="answer shortcuts"></div>

<script id="rows" type="application/json">__SCENARIOS__</script>
<script>
(function () {
  // one screen per answer; each flagged claim under it takes a yes or a no.
  // Answers save to the artifact's `reviews` collection, one doc per claim, keyed run__scenario__position.
  const RUN = __RUN__;
  const items = JSON.parse(document.getElementById("rows").textContent);
  const TOTAL = items.length;
  const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ── the reading aid: the faithfulness gate's rules (apps/api/app/domain/grounding.py, grounding-v3),
  // each named for its Python twin. It lights the passages the gate read and says why; it never labels ──
  const STOP = new Set(("the and for that with this from are was were has have had not but all any can you your they them " +
    "their there then than when what which who whom how why into onto over under out off per via about after before " +
    "between during each every some such only also more most other same both been being does did doing done will would " +
    "should could may might must shall here where while because since though although upon among along around these " +
    "those very much many just like within without across toward towards doesn didn aren wasn weren hasn haven").split(" "));
  const WORD_RE = () => /[A-Za-z0-9][A-Za-z0-9._\/-]*/g;
  // _SENT_RE: a sentence end, an optional closing quote (straight or curly), then a capital, a digit or an opener
  const SENT_RE = () => /(?<=[.!?]["')\]”’]?)\s+(?=[*`"'(\[A-Z0-9“‘])/g;
  const EMPTY = new Set();
  function esc(t) { return String(t ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
  // "deployed", "deploys" and "deploy" are one word to the overlap. Suffixes only, never below four letters
  function stem(t) {
    for (const suf of ["ies", "ing", "ed", "s"]) if (t.endsWith(suf) && t.length - suf.length >= 4) return suf === "ies" ? t.slice(0, -3) + "y" : t.slice(0, -suf.length);
    return t;
  }
  function norm(raw) {
    const t = raw.toLowerCase().replace(/[._\/-]+$/, "");
    if (!t) return "";
    if (/^[0-9]/.test(t)) return t;
    if (/[._\/-]/.test(t)) return t;
    if (t.length < 4 || STOP.has(t)) return "";
    return stem(t);
  }
  function tokensOf(text) { const set = new Set(), re = WORD_RE(); let m; while ((m = re.exec(text))) { const t = norm(m[0]); if (t) set.add(t); } return set; }
  function markup(text, shared) {
    const re = WORD_RE(); let out = "", last = 0, m;
    while ((m = re.exec(text))) { const t = norm(m[0]); if (!t || !shared.has(t)) continue; out += esc(text.slice(last, m.index)) + "<mark>" + esc(m[0]) + "</mark>"; last = m.index + m[0].length; }
    return out + esc(text.slice(last));
  }
  const inlineRich = html => html.replace(/`([^`]+)`/g, (_, c) => "<code>" + c + "</code>").replace(/\*\*([^*]+)\*\*/g, "$1");
  const inlineHtml = text => inlineRich(esc(text)).replace(/\*([^*]+)\*/g, "$1");
  // _score_text: a source marker names a document rather than asserting anything, so it stays out of the score
  const scoreText = text => text.replace(/\*\(([^()]*)\)\*/g, " ").replace(/[*`]/g, " ");
  const CARRIED_FLOOR = 0.4; // CARRIED_FLOOR
  // Python's \d, \w and \b match Unicode in a str pattern; JavaScript's match ASCII, even with the u flag.
  // \d is \p{Nd}, \w is [\p{L}\p{N}_], and \b beside a word character is a look-around on that class
  const W = String.raw`[\p{L}\p{N}_]`, NOT_W = String.raw`[^\p{L}\p{N}_]`, B_BEFORE = `(?<!${W})`, B_AFTER = `(?!${W})`;
  // _NUMBER_RE: a figure, 1,000,000 with its three-digit groups, 5.5, 20480, never "3,4" read as one. Any decimal digit
  const NUMBER_RE = () => /\p{Nd}{1,3}(?:,\p{Nd}{3})+(?:\.\p{Nd}+)?|\p{Nd}+(?:\.\p{Nd}+)?/gu;
  const numberKey = raw => raw.replace(/,/g, ""); // _number_key: 20,480 and 20480 are one number
  const numbersIn = text => text.match(NUMBER_RE()) || [];
  // _DECLINE_RE, _DOC_NOUN, _SAY_VERB: the documents, as subject, do not SAY something. Anchored, as re.match is
  const DOC_NOUN = "(?:corpus|documentation|documents?|docs|material|knowledge base|sources?|readmes?|portfolio documentation|retrieved (?:text|material|documentation|context))";
  const SAY_VERB = "(?:specify|specifies|say|says|state|states|mention|mentions|cover|covers|document|documents|describe|describes|address|addresses|provide|provides|name|names|list|lists|show|shows|explain|explains|detail|details|confirm|confirms|establish|establishes|define|defines|indicate|indicates|record|records|give|gives|include|includes|contain|contains)";
  const DECLINE_RE = new RegExp(`^${NOT_W}*` + String.raw`(?:(?:however|but|also|note that|based on [^,;]{1,40}|according to [^,;]{1,40}),?\s*)?(?:\*\*[^*]+\*\*\s*)?(?:` +
    String.raw`(?:the|this|our|my|that|these|its)\s+(?:${W}+\s+){0,2}?` + DOC_NOUN + String.raw`\s+(?:does not|doesn't|did not|didn't|do not|don't|never)\s+` + String.raw`(?:${W}+\s+)?` + SAY_VERB + B_AFTER +
    String.raw`|i (?:don't|do not) have (?:[\p{L}\p{N}_-]+\s+){0,3}?(?:information|documentation|record|details?)` + B_AFTER +
    String.raw`|(?:there is|there's) no (?:documented|recorded|stated|documentation|mention|information|record)` + B_AFTER +
    String.raw`|no (?:information|documentation|record|mention) (?:is|was|exists|about|on|of|in)` + B_AFTER + ")", "iu");
  // _SECOND_CLAUSE_RE
  const SECOND_CLAUSE_RE = new RegExp(String.raw`;|\s(?:but|yet|although|though|whereas)\s|` + `${B_BEFORE}it does${B_AFTER}|${B_BEFORE}it is${B_AFTER}`, "iu");
  // _CLAUSE_COMMA_RE: a comma before and/or joins a clause (a subject and a finite verb follow), not a list item
  const PLAIN_WORD = String.raw`(?!(?:the|a|an|this|that|these|those|its|our|my|their|your|which|who|whom|whose|where|when|it|they|we|each|every|all|and|or)` + B_AFTER + String.raw`)[a-z](?:${W}|-)*`; // _PLAIN_WORD
  const CLAUSE_SUBJECT = String.raw`(?:the|this|that|these|those|a|an|its|our|my|their|your)\s+(?:[A-Z](?:${W}|-)*\s+){0,2}(?:` + PLAIN_WORD + String.raw`\s+){1,3}?` + String.raw`|[A-Z](?:${W}|-)*\s+(?:` + PLAIN_WORD + String.raw`\s+){0,2}?`;
  const CLAUSE_VERBS = 'listens|runs|expects|requires|serves|writes|sends|provides|includes|contains|allows|keeps|takes|makes|gives|says|specifies|describes|fails|starts|stops|opens|closes|connects|accepts|exposes|depends|refers|applies|exists|follows|holds|validates|deploys|migrates|publishes|subscribes|emits|waits|throws|raises|wraps|saves|adds|removes|deletes|creates|generates|produces|consumes|reaches|sits|lives|goes|comes|gets|becomes|belongs|behaves|responds'; // _CLAUSE_VERBS: named, never guessed from an s ending
  const FINITE_VERB = '(?:is|are|was|were|has|have|had|does|do|did|will|would|can|cannot|could|should|must|may|might|shall|' + CLAUSE_VERBS + ')' + B_AFTER + String.raw`\s+(?:(?:${W}|-)+\s+){0,3}?(?:\p{Nd}|[A-Z])`;
  const CLAUSE_COMMA_RE = new RegExp(String.raw`,\s*(?:and|or)\s+(?:` + CLAUSE_SUBJECT + ')' + FINITE_VERB, 'u');
  const isDecline = t => DECLINE_RE.test(t) && !SECOND_CLAUSE_RE.test(t) && !CLAUSE_COMMA_RE.test(t); // is_decline
  // _INFERENCE_RE: a reason, a consequence or a purpose gets no second reading
  const INFERENCE_RE = new RegExp(B_BEFORE + "(because|therefore|thus|hence|consequently|so that|which means|this means|that means|as a result|in order to|favou?rs?|why)" + B_AFTER, "iu");
  const SECOND_PASSAGE_MIN_WORDS = 2; // SECOND_PASSAGE_MIN_WORDS
  // _second_reading: the best passage joined with the one adding the most words it lacks, two at least, at the same floor
  function secondReading(tokens, best, carried, ptokens) {
    const bt = ptokens[best]; let second = -1, added = 0;
    ptokens.forEach((pt, i) => { if (i === best) return; let n = 0; for (const t of tokens) if (pt.has(t) && !bt.has(t)) n++; if (n > added) { second = i; added = n; } });
    if (second < 0 || added < SECOND_PASSAGE_MIN_WORDS) return { carried, second: -1 };
    let both = 0; for (const t of tokens) if (bt.has(t) || ptokens[second].has(t)) both++;
    const share = both / tokens.size;
    return share < CARRIED_FLOOR ? { carried, second: -1 } : { carried: share, second };
  }
  // Python's format(x, ".0%"): the exact double times 100, a half rounded to even
  function percent(x) { const v = x * 100, f = Math.floor(v), d = v - f; return (d > 0.5 || (d === 0.5 && f % 2 === 1) ? f + 1 : f) + "%"; }
  // SentenceGrounding.reason, word for word
  function reasonOf(g) {
    if (g.decline) return "a decline asserts nothing the documents would carry";
    if (g.pi < 0) return "no passage shares a word with it";
    const parts = [g.span >= 0 ? `passages ${g.pi + 1} and ${g.span + 1} together carry ${percent(g.carried)} of its words` : `passage ${g.pi + 1} carries ${percent(g.carried)} of its words`];
    if (g.missing.length) parts.push("number " + g.missing.join(", ") + " appears in no passage");
    return parts.join("; ");
  }
  // _ground_sentence: the best passage (a tie to the denser one), the decline rule, the number rule, the second reading
  function groundSentence(statement, tokens, ptokens, numbers) {
    const g = { pi: -1, shared: EMPTY, score: 0, missing: [], decline: false, span: -1, spanShared: EMPTY, carried: 0, supported: false, reason: "", tint: "t-none" };
    let dens = 0;
    for (let i = 0; i < ptokens.length && tokens.size; i++) {
      const sh = new Set(); for (const tk of tokens) if (ptokens[i].has(tk)) sh.add(tk);
      const sc = sh.size / tokens.size, d = ptokens[i].size ? sh.size / ptokens[i].size : 0;
      if (sc > g.score || (sc === g.score && sc > 0 && d > dens)) { g.score = sc; g.pi = i; g.shared = sh; dens = d; }
    }
    g.carried = g.score;
    if (!tokens.size) return g;
    if (isDecline(statement)) g.decline = true;
    else {
      g.missing = numbersIn(statement).filter(n => !numbers.has(numberKey(n)));
      if (g.pi >= 0 && g.carried < CARRIED_FLOOR && !INFERENCE_RE.test(statement)) {
        const r = secondReading(tokens, g.pi, g.carried, ptokens); g.carried = r.carried; g.span = r.second;
        if (g.span >= 0) { const sh = new Set(); for (const tk of tokens) if (ptokens[g.span].has(tk)) sh.add(tk); g.spanShared = sh; }
      }
    }
    g.supported = g.decline || (g.pi >= 0 && g.carried >= CARRIED_FLOOR && !g.missing.length);
    g.reason = reasonOf(g);
    // with no passages at all, a decline is bone and every other sentence red, as the gate flags it
    g.tint = g.supported ? "t-bone" : (g.score > 0 && !g.missing.length ? "t-grey" : "t-fail");
    return g;
  }
  function splitSentences(text) {
    const re = SENT_RE(), parts = []; let m, start = 0;
    while ((m = re.exec(text))) { parts.push(text.slice(start, m.index)); start = m.index + m[0].length; }
    parts.push(text.slice(start));
    const out = [];
    for (const p of parts) { const s = p.trim(); if (!s) continue; if (out.length && (s.length < 28 || out[out.length - 1].length < 28)) out[out.length - 1] += " " + s; else out.push(s); }
    return out;
  }
  function responseUnits(response) {
    const text = String(response || ""); const cut = text.search(/(^|\n)\s*CITATIONS\s*:/);
    const body = cut === -1 ? text : text.slice(0, cut); const cites = cut === -1 ? "" : text.slice(cut).trim();
    const units = []; let fence = null, para = false;
    for (const line of body.split("\n")) {
      if (/^\s*```/.test(line)) { if (fence) { units.push({ kind: "code", text: fence.join("\n"), para: true, marker: "" }); fence = null; } else fence = []; continue; }
      if (fence) { fence.push(line); continue; }
      if (!line.trim()) { para = true; continue; }
      const m = line.match(/^\s*([-*•]|\d+[.)])\s+/); const rest = m ? line.slice(m[0].length) : line.trim();
      splitSentences(rest).forEach((s, i) => units.push({ kind: m ? (i === 0 ? "li" : "cont") : "p", text: s, para: para && i === 0, marker: (m && i === 0) ? m[1] : "" }));
      para = false;
    }
    if (fence) units.push({ kind: "code", text: fence.join("\n"), para: true, marker: "" });
    if (cites) units.push({ kind: "cite", text: cites, para: true, marker: "" });
    return units;
  }
  // each retrieved chunk cut at sentence ends into passages of about 300 characters
  function panePassages(contexts) {
    const passages = [], groups = [];
    for (const raw of contexts) {
      const b = String(raw || "").replace(/\r/g, "").trim(); if (!b) continue;
      const re = SENT_RE(), cuts = []; let m; while ((m = re.exec(b))) cuts.push(m.index + m[0].length); cuts.push(b.length);
      const idx = []; let start = 0;
      const take = end => { const text = b.slice(start, end).replace(/\s+$/, ""); if (text.trim()) { idx.push(passages.length); passages.push({ text }); } start = end; };
      for (const c of cuts) if (c - start >= 300) take(c);
      if (start < b.length) take(b.length);
      if (idx.length) groups.push(idx);
    }
    return { passages, groups };
  }
  const windowHtml = (p, shared) => inlineRich(shared ? markup(p.text, shared) : esc(p.text));
  function unitsHtml(units) {
    return units.map((u, i) => {
      const cls = ["sent", u.kind === "p" ? "" : u.kind, u.tint, u.para ? "para" : ""].filter(Boolean).join(" ");
      const open = (u.kind === "cite" || u.tint === "t-none") ? "" : ` data-s="${i}" tabindex="-1"`;
      const bullet = u.marker ? `<span class="bu">${/^[-*•]$/.test(u.marker) ? "•" : esc(u.marker)}</span> ` : "";
      const inner = u.kind === "code" ? esc(u.text) : bullet + inlineHtml(u.text);
      return `<span class="${cls}"${open}>${inner}</span>`;
    }).join("");
  }
  function analyse(it) {
    if (it.an) return it.an;
    const pane = panePassages(it.retrieved_contexts || []);
    const ptokens = pane.passages.map(p => tokensOf(p.text));
    const numbers = new Set(pane.passages.flatMap(p => numbersIn(p.text).map(numberKey)));
    const units = responseUnits(it.response);
    for (const u of units) {
      // the gate scores prose only: a code fence and the CITATIONS block never reach it (response_sentences)
      u.tokens = (u.kind === "cite" || u.kind === "code") ? EMPTY : tokensOf(scoreText(u.text));
      Object.assign(u, groundSentence(u.text, u.tokens, ptokens, numbers));
    }
    const plain = pane.passages.map(p => windowHtml(p, null));
    it.an = { units, passages: pane.passages, ptokens, numbers, plain, html: unitsHtml(units),
      paneHtml: pane.passages.length ? pane.groups.map(g => '<div class="ctxblock">' + g.map(i => `<p class="pw" data-i="${i}">${plain[i]}</p>`).join("") + "</div>").join("")
                                     : '<div class="ctxblock"><p class="pw">no retrieved text was stored for this answer</p></div>' };
    return it.an;
  }
  // the response sentence sharing most of a claim's words, or -1
  function carryingUnit(claim, units) {
    const ct = tokensOf(claim); if (!ct.size) return -1;
    let best = -1, bs = 0;
    units.forEach((u, i) => { if (u.kind === "cite" || u.kind === "code") return; let sh = 0; for (const t of ct) if (u.tokens.has(t)) sh++; const sc = sh / ct.size; if (sc > bs) { bs = sc; best = i; } });
    return best;
  }

  let sel = -1, lit = [];
  const sentEls = () => [...document.querySelectorAll(".sent[data-s]")];
  // lights the passages the gate read a grounding against: the best, and the second when it joined two
  function lightPassage(g, scroll, why) {
    const an = items[current].an;
    const pane = document.getElementById("ctxpane"), note = document.getElementById("ctxnote");
    for (const i of lit) { const old = pane.querySelector(`.pw[data-i="${i}"]`); if (old) { old.innerHTML = an.plain[i]; old.classList.remove("lit"); } }
    lit = [];
    if (g.pi < 0) { note.textContent = why; note.hidden = !an.passages.length; return; }
    note.hidden = true;
    const on = [[g.pi, g.shared]]; if (g.span >= 0) on.push([g.span, g.spanShared]);
    for (const [i, shared] of on) { const pw = pane.querySelector(`.pw[data-i="${i}"]`); if (!pw) continue; pw.innerHTML = windowHtml(an.passages[i], shared); pw.classList.add("lit"); lit.push(i); }
    const pw = pane.querySelector(`.pw[data-i="${g.pi}"]`);
    if (scroll && pw) { const top = pane.scrollTop + (pw.getBoundingClientRect().top - pane.getBoundingClientRect().top) - 10; pane.scrollTo({ top, behavior: REDUCED ? "auto" : "smooth" }); }
  }
  function selectSentence(n, scroll) {
    const an = items[current].an; const u = an && an.units[n]; if (!u) return;
    for (const s of sentEls()) { const on = Number(s.dataset.s) === n; s.classList.toggle("on", on); s.setAttribute("tabindex", on ? "0" : "-1"); }
    sel = n;
    lightPassage(u, scroll, "no passage shares words with that sentence");
  }
  // the CLAIM's own grounding, by the gate's rules, so the card says what the gate would say of it
  const claimGround = (statement, an) => groundSentence(statement, tokensOf(scoreText(statement)), an.ptokens, an.numbers);
  function moveSentence(d) {
    const els = sentEls(); if (!els.length) return;
    let i = els.findIndex(e => Number(e.dataset.s) === sel);
    i = i === -1 ? (d > 0 ? 0 : els.length - 1) : Math.max(0, Math.min(els.length - 1, i + d));
    els[i].focus(); selectSentence(Number(els[i].dataset.s), true);
  }

  // ── answers: key run__scenario__position -> {run_id, scenario_id, position, statement, supported} ──
  const answers = new Map();
  const key = (sid, pos) => RUN + "__" + sid + "__" + pos;
  let current = 0, activeClaim = 0, navigated = false, db = null;
  const saveEl = document.getElementById("save");
  const pending = new Map(); const dirty = new Set();
  let flushTimer = null, flushing = false;
  // with no artifact store, answers live in this tab only: expected for a local file, a fault on a published page
  const NO_DB = location.protocol === "file:" ? "local file, answers stay in this tab" : "not saving";
  function setSave(text, warn) { saveEl.textContent = text; saveEl.classList.toggle("warn", !!warn); }
  function settle() { if (db && !pending.size && !flushing) setSave("saved"); }
  function queue(k, data) {
    dirty.add(k); answers.set(k, data); pending.set(k, data);
    paintControls(); renderProgress(); renderList();
    if (!db) { setSave(NO_DB, true); return; }
    setSave("saving"); clearTimeout(flushTimer); flushTimer = setTimeout(flush, 500);
  }
  async function flush() {
    if (flushing || !db) return;
    flushing = true; let failed = false;
    try {
      while (pending.size) {
        const batch = [...pending.entries()]; pending.clear();
        try { for (const [k, data] of batch) await db.doc("reviews/" + k).set({ ...data, updated_at: new Date().toISOString() }); }
        catch (e) { for (const [k, data] of batch) if (!pending.has(k)) pending.set(k, data); failed = true; break; }
      }
    } finally { flushing = false; }
    if (failed) { setSave("save failed, retrying", true); clearTimeout(flushTimer); flushTimer = setTimeout(flush, 3000); } else settle();
  }
  function answer(i, supported) {
    const it = items[current]; const c = it.claims[i]; if (!c) return;
    const k = key(it.scenario_id, c.position);
    const cur = answers.get(k);
    if (cur && cur.supported === supported) return;
    queue(k, { run_id: RUN, scenario_id: it.scenario_id, position: c.position, statement: c.statement, supported });
  }
  function answerAll(supported) { items[current].claims.forEach((_, i) => answer(i, supported)); }
  const answerOf = (it, c) => { const a = answers.get(key(it.scenario_id, c.position)); return a ? a.supported : null; };
  const doneCount = it => it.claims.filter(c => answerOf(it, c) !== null).length;
  const done = it => doneCount(it) === it.claims.length;

  function paintControls() {
    const it = items[current];
    document.querySelectorAll(".card[data-i]").forEach(card => {
      const i = Number(card.dataset.i); const v = answerOf(it, it.claims[i]);
      card.classList.toggle("active", i === activeClaim);
      const g = claimGround(it.claims[i].statement, it.an);
      const ov = card.querySelector(".overlap");
      ov.textContent = g.reason;
      ov.className = "overlap k-" + g.tint.slice(2);
      card.querySelector(".vbtn.yes").classList.toggle("on", v === true); card.querySelector(".vbtn.yes").setAttribute("aria-pressed", v === true);
      card.querySelector(".vbtn.no").classList.toggle("on", v === false); card.querySelector(".vbtn.no").setAttribute("aria-pressed", v === false);
    });
    const c = it.claims[activeClaim]; const v = answerOf(it, c);
    document.getElementById("strip-n").textContent = `${activeClaim + 1}/${it.claims.length}`;
    document.getElementById("strip-s").textContent = c.statement;
    document.getElementById("strip-yes").classList.toggle("on", v === true);
    document.getElementById("strip-no").classList.toggle("on", v === false);
  }
  function renderProgress() {
    const cells = document.getElementById("cells");
    cells.style.setProperty("--cw-full", (Math.ceil(TOTAL / 2) * 8 - 2) + "px");
    cells.style.setProperty("--cw-narrow", (Math.ceil(TOTAL / 4) * 8 - 2) + "px");
    cells.innerHTML = items.map((it, i) => {
      const d = done(it); const only = it.claims.length === 1 ? answerOf(it, it.claims[0]) : null;
      const fill = d ? "full" + (only === true ? " yes" : only === false ? " no" : "") : "";
      return `<div class="cell ${fill} ${i === current ? "here" : ""}" title="${i + 1}: ${doneCount(it)} of ${it.claims.length}"></div>`;
    }).join("");
    const flagged = items.reduce((n, it) => n + it.claims.length, 0), answered = items.reduce((n, it) => n + doneCount(it), 0);
    document.getElementById("count").textContent = answered === flagged ? `${answered} / ${flagged}, all answered` : `${answered} / ${flagged}`;
  }
  function renderList() {
    const ol = document.getElementById("list");
    ol.innerHTML = items.map((it, i) => {
      const n = doneCount(it), t = it.claims.length;
      return `<li><button type="button" class="row ${i === current ? "here" : ""}" data-i="${i}"${i === current ? ' aria-current="true"' : ""}><span class="n">${i + 1}</span><span class="q"><span class="qt">${esc(it.question)}</span></span><span class="k ${n === t ? "done" : ""}">${n}/${t}</span></button></li>`;
    }).join("");
  }

  document.getElementById("strip").innerHTML = `
    <div class="strow"><span class="slabel" id="strip-n"></span><span class="sstatement" id="strip-s"></span></div>
    <div class="strow">
      <button type="button" class="vbtn yes" id="strip-yes" data-v="yes">YES</button>
      <button type="button" class="vbtn no" id="strip-no" data-v="no">NO</button>
      <div class="navbtns"><button type="button" class="btn" data-nav="prev" aria-label="Previous answer">&larr;</button><button type="button" class="btn primary" data-nav="next" aria-label="Next answer">&rarr;</button></div>
    </div>`;

  function focusClaim(i) {
    const it = items[current]; activeClaim = Math.max(0, Math.min(it.claims.length - 1, i));
    const c = it.claims[activeClaim];
    // the response sentence the claim came from is marked; the passage is chosen by the claim's own words
    const unit = carryingUnit(c.statement, it.an.units);
    for (const s of sentEls()) { const on = Number(s.dataset.s) === unit; s.classList.toggle("on", on); s.setAttribute("tabindex", on ? "0" : "-1"); }
    sel = unit;
    lightPassage(claimGround(c.statement, it.an), true, "no passage shares a word with this claim");
    paintControls();
    const card = document.querySelector(`.card[data-i="${activeClaim}"]`); if (card) card.scrollIntoView({ block: "nearest" });
  }
  function renderItem() {
    const it = items[current]; const A = analyse(it);
    document.getElementById("scenario").innerHTML = `
      <div class="block"><div class="eyebrow"><span>question &middot; ${current + 1} of ${TOTAL}</span></div><div class="question">${esc(it.question)}</div></div>
      <div class="block">
        <div class="eyebrow"><span>agent response</span></div>
        <div class="response">${A.html}</div>
        <div class="legend">left edge: what the grounding gate decided, and the card says why. The lit passages are the ones it read. <b class="k-bone">bone</b> grounded, by one passage, two together, or as a decline &middot; <b class="k-grey">grey</b> some words shared, too few &middot; <b class="k-fail">red</b> no word shared, or a number no passage states.</div>
      </div>`;
    document.getElementById("claims").innerHTML = `
      <div class="eyebrow"><span>flagged claims &middot; ${it.claims.length}</span></div>
      <div class="rubric">The judge could not find these in the retrieved text. Yes when a document of yours says it. No when none does.</div>
      <div class="bulk"><button type="button" class="btn" data-all="no">No to all ${it.claims.length}</button><button type="button" class="btn" data-all="yes">Yes to all</button></div>
      ${it.claims.map((c, i) => `
      <div class="card" data-i="${i}">
        <h3>Claim ${i + 1} of ${it.claims.length}${it.claims.length > 1 ? ' <span class="kbd"><b>Tab</b></span>' : ""}</h3>
        <div class="statement">${esc(c.statement)}</div>
        <div class="overlap"></div>
        <div class="seg">
          <button type="button" class="vbtn yes" data-v="yes" aria-label="claim ${i + 1} yes">YES</button>
          <button type="button" class="vbtn no" data-v="no" aria-label="claim ${i + 1} no">NO</button>
        </div>
      </div>`).join("")}
      <div class="navbtns">
        <button type="button" class="btn" data-nav="prev" ${current === 0 ? "disabled" : ""}>Previous</button>
        <button type="button" class="btn primary" data-nav="next" ${current === TOTAL - 1 ? "disabled" : ""}>Next</button>
      </div>`;
    const pane = document.getElementById("ctxpane"); pane.innerHTML = A.paneHtml; pane.scrollTop = 0;
    document.getElementById("ctxnote").hidden = true; sel = -1; lit = [];
    activeClaim = 0; focusClaim(0);
    renderProgress(); renderList();
    const here = document.querySelector("nav .row.here"); if (here) here.scrollIntoView({ block: "nearest" });
  }
  function go(i) { navigated = true; if (i < 0 || i >= TOTAL) return; if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); current = i; renderItem(); window.scrollTo({ top: 0 }); }

  document.addEventListener("click", e => {
    navigated = true;
    const card = e.target.closest(".card[data-i]");
    if (card && Number(card.dataset.i) !== activeClaim) focusClaim(Number(card.dataset.i));
    const vb = e.target.closest(".vbtn[data-v]");
    if (vb) { answer(card ? Number(card.dataset.i) : activeClaim, vb.dataset.v === "yes"); return; }
    const all = e.target.closest("[data-all]"); if (all) { answerAll(all.dataset.all === "yes"); return; }
    const nb = e.target.closest("[data-nav]"); if (nb) { if (!nb.disabled) go(nb.dataset.nav === "next" ? current + 1 : current - 1); return; }
    const sent = e.target.closest(".sent[data-s]"); if (sent) { selectSentence(Number(sent.dataset.s), true); return; }
    const row = e.target.closest(".row"); if (row) go(Number(row.dataset.i));
  });
  document.addEventListener("focusin", e => { const s = e.target.closest && e.target.closest(".sent[data-s]"); if (s && Number(s.dataset.s) !== sel) selectSentence(Number(s.dataset.s), true); });
  document.addEventListener("keydown", e => {
    navigated = true;
    if (e.key === "Tab" && !e.metaKey && !e.ctrlKey && !e.altKey) { e.preventDefault(); const n = items[current].claims.length; focusClaim((activeClaim + (e.shiftKey ? n - 1 : 1)) % n); return; }
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "ArrowRight") { go(current + 1); return; }
    if (e.key === "ArrowLeft") { go(current - 1); return; }
    if (e.key === "j" || e.key === "k") { e.preventDefault(); moveSentence(e.key === "j" ? 1 : -1); return; }
    if (e.key === "y") { answer(activeClaim, true); return; }
    if (e.key === "n") { answer(activeClaim, false); return; }
    if (e.key === "N") { answerAll(false); return; }
    if (e.key === "Enter") { const a = document.activeElement; if (a && a.classList && a.classList.contains("sent")) { e.preventDefault(); selectSentence(Number(a.dataset.s), true); } }
  });

  renderItem();

  (async () => {
    db = window.claude && window.claude.use ? await window.claude.use("db") : null;
    if (!db) { setSave(NO_DB, true); return; }
    try {
      const snap = await db.collection("reviews").get();
      for (const doc of snap.docs) {
        const v = doc.data(); if (!v || v.run_id !== RUN || !v.scenario_id) continue;
        const k = key(v.scenario_id, v.position);
        if (pending.has(k) || dirty.has(k)) continue;
        answers.set(k, v);
      }
      if (!navigated) { const first = items.findIndex(it => !done(it)); current = first === -1 ? 0 : first; }
      renderItem();
      if (pending.size) flush(); else settle();
    } catch (e) { setSave("could not load answers", true); }
  })();
})();
</script>
