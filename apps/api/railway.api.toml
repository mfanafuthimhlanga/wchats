# Railway config as code for the API service (ADR 0005, ticket 18).
#
# One repo, four services, one file per service.
#
# Root Directory is set once per service in the Railway UI and cannot live in a
# file: Settings > Source > Root Directory = apps/api. With the root set,
# Railway detects the Dockerfile in this directory and the builder below stops
# it from ever falling back to Railpack, which is what produced "could not
# determine how to build the app" on the first deploy.
#
# WHETHER RAILWAY READS THIS FILE AT ALL IS NOT GUARANTEED (#139). Config as
# Code is deprecated; existing files keep working until 2026-12-01, and a
# service that has never used it cannot opt in since 2026-08-28. Where the
# section is closed, this file is the record the operator types from, field by
# field, and `scripts/railway_staging_wizard.sh` reads the values out of it so
# the two cannot disagree. A change here then does NOT reach Railway on its own.
#
# Build command: none. The Dockerfile is the build.
# Watch paths are relative to the repo root: a push that touches only the
# admin or the widget does not rebuild the API.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["apps/api/**"]

[deploy]
# Bring the CONTROL database and then every tenant database to head BEFORE any
# of the four services serve the new code (#64).
#
# Tenant migrations run once, at provision, and nothing re-ran them: a tenant
# provisioned before 0018 sits at 0017, and the new chunk INSERT meets a column
# that is not there. The control database had it worse. Nothing migrated it at
# deploy at all, so staging was found at 0020 on 2026-09-04 while main was at
# 0022 and the owner upgraded it by hand.
#
# `predeploy.py` runs the control migration first and refuses to walk the fleet
# when it fails, because the walk reads the fleet OUT of the control DB. Railway
# runs this on the built image, with the service's variables, and aborts the
# deployment if it exits nonzero, so a database that could not be migrated
# leaves the old code serving the old schema rather than shipping new code past
# it. One line for the control DB and one per tenant in the deploy log, each
# carrying the revision it moved between; no connection string in any of them.
#
# Only this service carries it. Four services running the same walk at once
# would race each other for the same Alembic lock on every database.
preDeployCommand = "python scripts/predeploy.py"
# Railway injects PORT and routes public traffic to it. The Dockerfile's CMD
# binds 8000; this overrides it so the bound port is whatever Railway chose.
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
