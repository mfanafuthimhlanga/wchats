# Railway config as code for the API service (ADR 0005, ticket 18).
#
# One repo, four services, one file per service. The two fields that cannot
# live in a file are set once per service in the Railway UI:
#   Settings > Source > Root Directory        apps/api
#   Settings > Config-as-code > file path     railway.api.toml
# With the root set, Railway detects the Dockerfile in this directory and the
# builder below stops it from ever falling back to Railpack, which is what
# produced "could not determine how to build the app" on the first deploy.
#
# Build command: none. The Dockerfile is the build.
# Watch paths are relative to the repo root: a push that touches only the
# admin or the widget does not rebuild the API.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["apps/api/**"]

[deploy]
# Bring every tenant database to head BEFORE any of the four services serve the
# new code (#64). Tenant migrations run once, at provision, and nothing re-ran
# them: a tenant provisioned before 0018 sits at 0017, and the new chunk INSERT
# meets a column that is not there. Railway runs this on the built image, with
# the service's variables, and aborts the deployment if it exits nonzero, so a
# tenant that could not be migrated leaves the old code serving the old schema
# rather than shipping new code past it. One line per tenant in the deploy log,
# carrying the revision it moved between; no connection string in any of them.
preDeployCommand = "python scripts/migrate_all_tenants.py"
# Railway injects PORT and routes public traffic to it. The Dockerfile's CMD
# binds 8000; this overrides it so the bound port is whatever Railway chose.
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
