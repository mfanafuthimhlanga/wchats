[project]
name = "wchats-api"
version = "0.1.0"
description = "W Chats control plane API"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.136.1",
    "uvicorn[standard]==0.34.3",
    "pydantic>=2.0,<3.0",
    "pydantic-settings==2.14.1",
    "celery[redis]==5.6.3",
    "redis==6.4.0",
    "sqlalchemy[asyncio]==2.0.49",
    "alembic==1.18.4",
    "asyncpg==0.31.0",
    "psycopg2-binary==2.9.12",
    "cryptography==48.0.0",
    "argon2-cffi==25.1.0",
    "sse-starlette==3.4.4",
    "structlog==25.5.0",
    "sentry-sdk==2.59.0",
    "httpx==0.28.1",
    "neon-api==0.3.0",
    "voyageai==0.3.7",
    "anthropic==0.101.0",
    "langfuse>=4.0.0,<5.0.0",
    "python-multipart==0.0.20",
    "tenacity==9.1.2",
    "claude-agent-sdk==0.1.81",
    # M6: Eval system — Ragas 0.4.x with InstructorLLM (Anthropic) (D-01 LOCKED)
    "ragas>=0.4.0,<0.5.0",
    # langchain-community pinned <0.4: ragas 0.4.3 (latest 0.4.x) hard-imports
    # `langchain_community.chat_models.vertexai`, which was REMOVED in the 0.4 line.
    # ragas declares langchain-community unpinned, so a fresh resolve picks 0.4.x and
    # `import ragas` dies at ModuleNotFoundError — taking every module that imports
    # app.main down with it. 0.3.31 still ships that module and satisfies
    # langchain-core<2.0.0,>=0.3.78, so the rest of the langchain stack is unaffected.
    # Revisit when ragas ships a 0.5.x that drops the legacy vertexai import.
    "langchain-community<0.4",
    "instructor>=1.0.0,<2.0.0",
    "python-jose[cryptography]==3.5.0",
    "PyJWT[cryptography]==2.12.1",
    "svix==1.93.0",
    # P13-02: Bedrock embeddings — AWS first-party SDK (boto3 approved in research Package Legitimacy Audit)
    "boto3>=1.34,<2.0",
    # P16-02: Provider SDKs — supply-chain gate cleared (human checkpoint T-16-SC approved)
    # stripe 15.3.0: official Stripe SDK (github.com/stripe/stripe-python), enables thread-safe StripeClient pattern
    "stripe==15.3.0",
    # ShopifyAPI 12.7.0: official Shopify SDK (github.com/Shopify/shopify_python_api), last release Nov 2024
    "ShopifyAPI==12.7.0",
    # requests-oauthlib>=2.0: WooCommerce OAuth1 fallback (WooCommerce PyPI package rejected — 5-year stale)
    # Plan 16-05 WooCommerce adapter uses httpx + requests-oauthlib OAuth1 signing
    "requests-oauthlib>=2.0",
    # P17-02: SMS OTP — supply-chain gate cleared (human checkpoint T-17-SC approved)
    # twilio 9.10.9: official Twilio SDK (github.com/twilio/twilio-python) — SMS OTP default (OD-2), verified 17-02 human gate
    "twilio==9.10.9",
]

[project.optional-dependencies]
pipeline = [
    "docling==2.93.0",
    # transformers>=4.47.0 required: rt_detr_v2 layout model support added in 4.47.0.
    # docling-ibm-models 3.x uses RT-DETRv2 for layout detection; older transformers
    # raises ValueError: "model type `rt_detr_v2` not recognized".
    "transformers>=4.47.0",
]
dev = [
    "pytest",
    "pytest-asyncio==1.3.0",
    # ci.yml has passed --cov=app --cov-fail-under=80 since the workflow was written;
    # without pytest-cov pytest exits 4 on `unrecognized arguments` and the unit job
    # has never once run a test.
    "pytest-cov>=5.0",
    "respx==0.23.1",
    "ruff==0.16.3",
    "lizard>=1.23.0",
    "import-linter>=2.13",
    "mutmut>=3.7.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: Integration tests requiring real local Postgres and Redis (use -m integration to run)",
    "e2e: Nightly E2E tests requiring a real Neon API key (use -m e2e to run)",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Moved out of [tool.ruff]: the top-level `select`/`ignore` spellings are deprecated
# and printed a warning on every single invocation, including in CI.
select = ["E", "F", "I"]
ignore = ["E501"]

# Both contracts below were measured against the tree before they were written, and
# each was observed to go BROKEN under a deliberate mutation and KEPT again after
# restore. Neither is a target: they pin the structure that already holds.
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
# Direction measured from the 444 real dependencies, not chosen: every observed edge
# already runs down this list and not one runs up. app.models, app.core and app.utils
# import no sibling at all, so they sit together on the bottom rung.
# Observed 2026-08-15: KEPT. Mutation `app.services.storage_service -> app.api.deps`
# turned it BROKEN, naming that exact import.
name = "app layers run one way"
type = "layers"
layers = [
    "app.main",
    "app.api",
    "app.worker",
    "app.schemas",
    "app.services",
    "app.models | app.core | app.utils",
]

[[tool.importlinter.contracts]]
# app.services is skipped because it is cyclic TODAY and this gate may not fail on
# arrival. Four import pairs form those cycles, measured 2026-08-15:
#   app.services:               agent_tools -> transactional
#                               embedding_service -> bedrock_embedding_service
#                               red_team_service -> red_team_probe
#   app.services.transactional: provider_adapter -> adapters
# Delete the skip once those four are gone; the contract then covers the whole tree.
# Observed 2026-08-15: KEPT. Mutation `app.worker.celery_app -> app.worker.tasks`
# turned it BROKEN, naming app.worker.
name = "no import cycles outside app.services"
type = "acyclic_siblings"
ancestors = ["app"]
skip_descendants = ["app.services"]

[tool.mutmut]
# Configured so a mutation run is reproducible elsewhere; it is NOT a gate here.
# mutmut 3.7.0 refuses to start on native Windows (it exits 1 on any argument,
# including --version, gating on sys.platform before parsing). On this 4 GB box a
# full run is out of reach regardless. Run it under WSL or Linux CI, differentially.
paths_to_mutate = "app/"
tests_dir = "tests/unit/"
runner = "python -m pytest tests/unit -x -q --no-header -p no:cacheprovider"

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pydantic-mypy]
# The plugin defaults init_typed=false, which types every synthesised __init__
# parameter as Any and silently hides real constructor type errors (four of them
# in this tree). Keep the checking; we only want the BaseSettings behaviour.
init_typed = true
