[project]
name = "veridian-api"
version = "0.1.0"
description = "Veridian control plane API"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.136.1",
    "pydantic>=2.0,<3.0",
    "pydantic-settings==2.14.1",
    "celery[redis]==5.6.3",
    "redis==6.4.0",
    "sqlalchemy[asyncio]==2.0.49",
    "alembic==1.18.4",
    "asyncpg==0.31.0",
    "psycopg2-binary==2.9.12",
    "cryptography==48.0.0",
    "argon2-cffi==25.1.0",
    "sse-starlette==3.4.4",
    "structlog==25.5.0",
    "sentry-sdk==2.59.0",
    "httpx==0.28.1",
    "neon-api==0.3.0",
    "docling==2.93.0",
    "chonkie==1.6.5",
    "voyageai==0.3.7",
    "anthropic==0.101.0",
    "python-multipart==0.0.20",
    "tenacity==9.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio==1.3.0",
    "respx==0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: Integration tests requiring real local Postgres and Redis (use -m integration to run)",
    "e2e: Nightly E2E tests requiring a real Neon API key (use -m e2e to run)",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
