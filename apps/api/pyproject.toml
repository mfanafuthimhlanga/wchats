[project]
name = "wchats-api"
version = "0.1.0"
description = "W Chats control plane API"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.136.1",
    "uvicorn[standard]==0.34.3",
    "pydantic>=2.0,<3.0",
    "pydantic-settings==2.14.1",
    "celery[redis]==5.6.3",
    "redis==6.4.0",
    "sqlalchemy[asyncio]==2.0.49",
    "alembic==1.18.4",
    "asyncpg==0.31.0",
    "psycopg2-binary==2.9.12",
    "cryptography==48.0.0",
    "argon2-cffi==25.1.0",
    "sse-starlette==3.4.4",
    "structlog==25.5.0",
    "sentry-sdk==2.59.0",
    "httpx==0.28.1",
    "neon-api==0.3.0",
    "voyageai==0.3.7",
    "anthropic==0.101.0",
    "langfuse>=4.0.0,<5.0.0",
    "python-multipart==0.0.20",
    "tenacity==9.1.2",
    "claude-agent-sdk==0.1.81",
    # M6: Eval system — Ragas 0.4.x with InstructorLLM (Anthropic) (D-01 LOCKED)
    "ragas>=0.4.0,<0.5.0",
    "instructor>=1.0.0,<2.0.0",
    "python-jose[cryptography]==3.5.0",
    "PyJWT[cryptography]==2.12.1",
    "svix==1.93.0",
    # P13-02: Bedrock embeddings — AWS first-party SDK (boto3 approved in research Package Legitimacy Audit)
    "boto3>=1.34,<2.0",
    # P16-02: Provider SDKs — supply-chain gate cleared (human checkpoint T-16-SC approved)
    # stripe 15.3.0: official Stripe SDK (github.com/stripe/stripe-python), enables thread-safe StripeClient pattern
    "stripe==15.3.0",
    # ShopifyAPI 12.7.0: official Shopify SDK (github.com/Shopify/shopify_python_api), last release Nov 2024
    "ShopifyAPI==12.7.0",
    # requests-oauthlib>=2.0: WooCommerce OAuth1 fallback (WooCommerce PyPI package rejected — 5-year stale)
    # Plan 16-05 WooCommerce adapter uses httpx + requests-oauthlib OAuth1 signing
    "requests-oauthlib>=2.0",
    # P17-02: SMS OTP — supply-chain gate cleared (human checkpoint T-17-SC approved)
    # twilio 9.10.9: official Twilio SDK (github.com/twilio/twilio-python) — SMS OTP default (OD-2), verified 17-02 human gate
    "twilio==9.10.9",
]

[project.optional-dependencies]
pipeline = [
    "docling==2.93.0",
    # transformers>=4.47.0 required: rt_detr_v2 layout model support added in 4.47.0.
    # docling-ibm-models 3.x uses RT-DETRv2 for layout detection; older transformers
    # raises ValueError: "model type `rt_detr_v2` not recognized".
    "transformers>=4.47.0",
]
dev = [
    "pytest",
    "pytest-asyncio==1.3.0",
    "respx==0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: Integration tests requiring real local Postgres and Redis (use -m integration to run)",
    "e2e: Nightly E2E tests requiring a real Neon API key (use -m e2e to run)",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
