# Railway config as code for Celery beat (ADR 0005, ticket 18).
#
# The scheduler for the nightly eval and the weekly red team. Exactly one
# replica, ever: two beats enqueue every schedule twice. The per-agent
# fan-outs select deployed Agents only, so they are empty before the first
# deploy; the schedule still carries the usage-pricing rollup and the
# dispatcher ticks themselves.
#
# UI fields, once per service:
#   Settings > Source > Root Directory        apps/api
#   Settings > Config-as-code > file path     railway.beat.toml
# No public networking; no health check.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["apps/api/**"]

[deploy]
startCommand = "celery -A app.worker.celery_app beat --loglevel=info"
numReplicas = 1
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
