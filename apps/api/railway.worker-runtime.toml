# Railway config as code for the runtime worker (ADR 0005, ticket 18).
#
# Consumes the `runtime` queue only: evals, red team, agent calls. Built from
# the plain Dockerfile, so no torch and no docling; this is the worker to run
# first on a small budget, because it validates agent turns and evals without
# the 3 GB pipeline image idling beside it.
#
# UI fields, once per service:
#   Settings > Source > Root Directory        apps/api
#
# WHETHER RAILWAY READS THIS FILE AT ALL IS NOT GUARANTEED (#139). Config as
# Code is deprecated; existing files keep working until 2026-12-01, and a
# service that has never used it cannot opt in since 2026-08-28. Where the
# section is closed, this file is the record the operator types from, field by
# field, and `scripts/railway_staging_wizard.sh` reads the values out of it so
# the two cannot disagree. A change here then does NOT reach Railway on its own.
# No public networking; no health check (Celery has no HTTP surface).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["apps/api/**"]

[deploy]
startCommand = "celery -A app.worker.celery_app worker --queues=runtime --hostname=runtime@%h --loglevel=info --concurrency=2"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
