# Alembic configuration for per-tenant DBs
# sqlalchemy.url is a placeholder — overridden at runtime via
# config.attributes['connection'] injection from the apply_migrations Celery task.
# For CLI use: set CONTROL_DB_SYNC_URL or supply -x sqlalchemy.url=...

[alembic]
# Absolute path derived at runtime in env.py via Path(__file__).parent
script_location = alembic_tenant

# Template for migration file names
file_template = %%(rev)s_%%(slug)s

# Truncation for the slug
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
